[package]
name = "took"
version = "0.1.0"
description = "Tool · 周期打卡日历（PC 端，首期只读月历）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "took_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features = false：tauri 默认开 common-controls-v6，它要求进程带 comctl32 v6 的
# 应用清单。cargo test 编出的测试 exe 没有清单，Windows 会去绑 v5 的 comctl32 并报
# STATUS_ENTRYPOINT_NOT_FOUND（0xC0000139），单元测试根本起不来。
# 关掉 v6 后主程序的窗口与菜单照常（只是系统对话框走 v5 样式），测试也能跑。
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# Win32_UI_WindowsAndMessaging / Win32_System_Threading 是贴壁纸层要的：
# FindWindowW / SetParent / EnumWindows / SetWindowPos / GetCurrentThreadId。
windows-sys = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  # 吸附要用显示器工作区（MonitorFromWindow / GetMonitorInfoW 在 Graphics_Gdi 下），
  # 透明度要用 SetLayeredWindowAttributes（WindowsAndMessaging 下，已启用）
  "Win32_Graphics_Gdi",
] }

[profile.dev]
incremental = true