/** 打卡面板按规则分组：组标题 = 规则标题 + 摘要小字，组内每个任务一行；记事单独一组只读 */
function renderSheet() {
  const key = STATE.sheetDate;
  if (!key) return;
  const p = parseKey(key);
  const isToday = key === TODAY;
  const tasks = tasksOn(key);
  const notes = notesOn(key);
  const doneN = tasks.filter(it => isDone(it, key)).length;

  $('#sheetTitle').textContent = `${p.m} 月 ${p.d} 日 · ${WEEK_CN2[weekdayIndex(key)]}`;
  $('#sheetSub').innerHTML = (isToday ? '<span class="today-dot">今天</span> · ' : '')
    + `已完成 ${doneN} / ${tasks.length}`;

  // 按规则分组（保持规则在 STATE.items 里的顺序）
  const groups = [];
  allRules().forEach(rule => {
    const rows = flatTasksOn(rule, key);
    if (rows.length) groups.push({ rule, rows });
  });

  const groupHtml = groups.map(({ rule, rows }) => {
    const inner = rows.map(it => {
      const done = isDone(it, key);
      return `<button type="button" class="mtask${done ? ' done' : ''}" data-task="${it.id}">
        <span class="tick">${ICON.check}</span>
        <span class="mtask-name">${esc(it.title)}</span>
        <span class="mtask-state">${done ? '已打卡' : '待打卡'}</span>
      </button>`;
    }).join('');
    return `<div class="sgroup" data-group="${rule.id}">
      <div class="sgroup-head">
        <b>${esc(rule.title)}</b>
        <span class="sgroup-sum">${esc(summaryOf(rule))}</span>
        <button type="button" class="sgroup-add" data-addtask="${rule.id}"
                aria-label="为规则「${esc(rule.title)}」添加任务" title="新建任务">${ICON.chevron}</button>
      </div>
      ${inner}
    </div>`;
  }).join('');

  const noteHtml = notes.length ? `<div class="sgroup note-group">
      <div class="sgroup-head"><b>记事</b><span class="sgroup-sum">只读 · 不可打卡</span>
        <button type="button" class="sgroup-add" data-addnote="1"
                aria-label="新建记事" title="新建记事">${ICON.chevron}</button>
      </div>
      ${notes.map(it => `<div class="mnote" data-note="${it.id}">
        <span class="tick"></span>
        <span style="flex:1;min-width:0">
          <span class="mtask-name">${esc(it.title)}<span class="badge note" style="margin-left:8px">记事</span></span>
          <span class="txt">${esc(noteRangeLabel(it) + (it.content ? ' · ' + it.content : ''))}</span>
        </span>
        <span class="mtask-state">不可打卡</span>
      </div>`).join('')}
    </div>` : '';

  $('#sheetList').innerHTML = (groupHtml + noteHtml) || '<div class="mempty">今天没有命中任何任务</div>';

  const allDone = tasks.length > 0 && tasks.every(it => isDone(it, key));
  const allBtn = $('#sheetAll');
  allBtn.textContent = allDone ? '撤销全部' : '全部打卡';
  allBtn.disabled = tasks.length === 0;
}

/* 勾选 / 取消：按任务独立，该任务在其规则周期内所有命中日同步 + 烟花 + 完成提示卡 */
function toggleTask(itemId, anchorEl) {
  const key = STATE.sheetDate;
  if (!key) return;
  const item = tasksOn(key).find(it => it.id === itemId);
  if (!item) return;
  const nowDone = !isDone(item, key);

  // 落点必须在重绘之前量：renderSheet() 会替换行节点，之后再量只能拿到 0
  const rect = (anchorEl || $('#sheetList')).getBoundingClientRect();
  const burstAt = { x: rect.left + 18, y: rect.top + rect.height / 2 };

  setDone(item, key, nowDone);
  renderSheet();
  renderGrid();
  fitTagsInGrid();

  if (nowDone) {
    fireworks.burst(burstAt.x, burstAt.y);
    showDoneToast(`已完成 · ${item.title}`, `${periodLabel(item.rule, key)} 已打卡`);
  } else {
    showSnack(`已撤销 · ${item.title}`);
  }
}

function toggleAll() {
  const key = STATE.sheetDate;
  const tasks = tasksOn(key);
  if (!tasks.length) return;
  const allDone = tasks.every(it => isDone(it, key));
  if (allDone) {
    tasks.forEach(it => setDone(it, key, false));
    renderSheet();
    renderGrid();
    fitTagsInGrid();
    showSnack(`已撤销 ${tasks.length} 项打卡`);
    return;
  }
  const undone = tasks.filter(it => !isDone(it, key));
  const rect = $('#sheetAll').getBoundingClientRect();
  undone.forEach(it => setDone(it, key, true));
  renderSheet();
  renderGrid();
  fitTagsInGrid();
  fireworks.burst(rect.left + rect.width / 2, rect.top);
  showDoneToast(undone.length === 1 ? `已完成 · ${undone[0].title}` : `已完成 ${undone.length} 项任务`,
    `${periodLabel(undone[0].rule, key)} 已打卡`);
}

const dialogMask  = $('#dialogMask');

const layerStack  = [];     // 记录当前打开的层，用于 Esc 逐层关闭

function pushLayer(fn) { layerStack.push(fn); }
function popLayer(fn) {
  const i = layerStack.lastIndexOf(fn);
  if (i >= 0) layerStack.splice(i, 1);
}
/* Esc：逐层关闭当前最上层（弹窗 → 面板 → 整页视图） */

  if (e.key !== 'Escape') return;
  const top = layerStack[layerStack.length - 1];
  if (top) { e.preventDefault(); top(); return; }
  if (!sheetMask.hidden) { e.preventDefault(); closeSheet(); return; }
  if (!analysisScreen.hidden) { e.preventDefault(); closeAnalysis(); return; }
  if (!settingsScreen.hidden) { e.preventDefault(); closeSettings(); return; }

        <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-act="ok">${esc(okText)}</button>
      </div>
    </div>`;
  confirmMask.hidden = false;
  const close = () => { confirmMask.hidden = true; confirmMask.innerHTML = ''; popLayer(close); };

    if (e.target.closest('[data-act="ok"]')) { close(); onOk && onOk(); }

}

   ========================================================================= */
const rulesPanel = $('#rulesPanel');
const rulesScreen = rulesPanel;      // 沿用旧名：选择态 class 现在挂在 #rulesPanel 上
const rulesListEl = $('#rulesList');
const fabBtn = $('#fabBtn');
const KIND_CN = { task: '任务', note: '记事', countdown: '倒数日', notebook: '笔记' };

/** 记事的日期文案：未排期 / 单日 / 时间段（写进摘要与打卡面板） */
function noteRangeLabel(item) {
  if (!item.start) return '未排期';
  const day = item.start.replace(/-/g, '/');
  if (!item.end || item.end === item.start) return day;
  return `${day} ~ ${mdText(item.end)}`;
}

function summaryOf(item) {
  if (item.kind === 'countdown') {
    const delta = diffDays(TODAY, item.start);
    const ago = delta < 0 ? `已经 ${-delta} 天` : delta === 0 ? '就是今天' : `还有 ${delta} 天`;
    return `目标日 ${item.start.replace(/-/g, '/')} · ${ago}`;
  }
  if (item.kind === 'notebook') {
    const body = (item.content || '').trim();
    return body || '还没有正文 · 笔记';
  }
  if (item.kind === 'note') return `${noteRangeLabel(item)} · 记事`;

  const parts = [];
  const repeat = item.repeat || 'none';
  if (repeat === 'weekly') {
    const wd = [...(item.weekdays || [])].sort((a, b) => a - b);
    parts.push(wd.length ? `每${compactWeekdays(wd)}` : '每周（未选日期）');
  } else if (repeat === 'every') {
    parts.push(`每 ${clampEvery(item.every || 1)} 天`);
  } else if (repeat === 'monthly') {
    parts.push(item.monthDay === 'last' ? '每月最后一天' : `每月 ${parseMonthDay(item.monthDay || 20)} 日`);
  } else if (repeat === 'yearly') {
    parts.push(`每年 ${parseYearMonth(item.yearMonth || 1)} 月 ${parseYearDay(item.yearDay || 1)} 日`);
  } else {
    parts.push('不重复');
  }
  const endKey = item.repeatUntil || item.end;
  parts.push(`${mdText(item.start)}~${endKey ? mdText(endKey) : '不限'}`);
  const ch = channelsOf(item.reminder);
  if (ch.notify || ch.alarm) {
    const time = (item.reminder && item.reminder.time) || '09:00';
    parts.push([ch.notify ? `通知 ${time}` : '', ch.alarm ? `闹钟 ${time}` : ''].filter(Boolean).join(' + '));
  }
  return parts.join(' · ');
}

/** 把 [0,1,2,3,4] 合成 "周一~周五"，把 [0,4] 合成 "周一、周五"（前面再加「每」即为规则文案） */
function compactWeekdays(wd) {
  if (!wd.length) return '';
  const runs = [];
  let s = wd[0];
  let prev = wd[0];
  for (let i = 1; i <= wd.length; i += 1) {
    const cur = wd[i];
    if (cur === prev + 1) { prev = cur; continue; }
    runs.push([s, prev]);
    s = cur;
    prev = cur;
  }
  return runs.map(([a, b]) => (a === b ? WEEK_CN2[a] : `${WEEK_CN2[a]}~${WEEK_CN2[b]}`)).join('、');
}

/* ---------- 规则级完成率：汇总规则下所有任务的周期完成情况 ---------- */
/**
 * 完成率 = 已打卡周期数 ÷ 应打卡周期数（统计口径见设置 → 数据）。
 * 规则下每个任务各自按规则的周期切分，再汇总到规则层。
 * 只统计「截至今天已到期」的周期，含停用前的历史打卡。
 */
function rateOf(rule) {
  const seen = new Set();
  let total = 0;
  let done = 0;
  if (!rule) return { done: 0, total: 0, pct: 0 };
  const tasks = rule.tasks || [];
  if (!tasks.length) return { done: 0, total: 0, pct: 0 };
  const repeat = rule.repeat || 'none';
  const end = repeat === 'none' ? rule.start : (rule.repeatUntil || rule.end);
  const last = end && end < TODAY ? end : TODAY;
  if (rule.start > last) return { done: 0, total: 0, pct: 0 };

  for (let k = rule.start; k <= last; k = addDaysKey(k, 1)) {
    if (!occursOn({ ...rule, enabled: true }, k)) continue;
    const ps = periodStartOf(rule, k);
    if (seen.has(ps)) continue;
    seen.add(ps);
    tasks.forEach(t => {
      total += 1;
      if (STATE.checkins.get(t.id + ':' + ps) === true) done += 1;
    });
  }
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

  $('#btnSelect').setAttribute('aria-pressed', String(STATE.selecting));
  const TIP = {
    rule: '点规则主体编辑基础条件；点左侧箭头展开任务；右侧开关可快速启停',
    note: '点任意一条编辑标题、日期区间与正文；右侧开关可快速启停',
    countdown: '点任意一条编辑标题与目标日；右侧开关可快速启停',
    notebook: '点任意一条编辑名称与正文；右侧开关可快速启停',
  };
  const noun = CAT_NOUN[cat] || '条目';
  $('#rulesTip').textContent = STATE.selecting
    ? '已选 ' + STATE.selected.size + ' 条' + noun + ' · 点条目切换选择，右下角按钮只删除当前分类的' + noun
    : (TIP[cat] || TIP.rule);

  // 三缸按钮 → 圆形操作条从右往左滑出
  $('#selBar').classList.toggle('on', STATE.selecting);
  $('#selCount').textContent = STATE.selecting ? '已选 ' + STATE.selected.size : '';

  rulesListEl.innerHTML = list.map(it => {
    const sel = STATE.selected.has(it.id);
    const off = it.enabled === false;
    const selCls = sel ? ' sel' : '';
    const offCls = off ? ' off' : '';
    const offTag = off ? '<span class="off-tag">已停用</span>' : '';
    const swHtml = '<button type="button" class="switch" role="switch" data-switch="' + it.id
      + '" aria-checked="' + (!off) + '" aria-label="启用 ' + esc(it.title) + '" tabindex="0"></button>';

    // 记事 / 倒数日 / 笔记：不挂规则下、不可展开、只读展示，用徽章区分
    if (!isRule(it)) {
      // 笔记本行：标题 + 分类 chip + 正文摘要（分类 chip 在摘要上一行）
      const catChip = it.kind === 'notebook'
        ? '<span class="book-tag">' + ICON.folder + esc(categoryOf(it)) + '</span>' : '';
      return '<div class="rule-row' + selCls + offCls + '" data-rule="' + it.id + '" data-flat="1" role="button"'
        + ' tabindex="0" aria-label="编辑 ' + esc(it.title) + '">'
        + '<span class="circle">' + ICON.check + '</span>'
        + '<span class="rule-main">'
        /* 类型已由左导航决定，行内不再放类型徽章：它排在标题前会把
           记事/倒数日/笔记本的标题整体右推约 44px，与规则行对不齐 */
        + '<span class="rule-name">'
        + '<b>' + esc(it.title || (it.kind === 'notebook' ? '无标题笔记' : '')) + '</b>' + offTag + '</span>'
        + (catChip ? '<span style="display:block">' + catChip + '</span>' : '')
        + '<span class="rule-sum">' + esc(summaryOf(it)) + '</span>'
        + '</span>'
        + '<span class="rule-side">' + swHtml + '</span>'
        + '</div>';
    }

    const isOpen = expanded.has(it.id);
    const tasks = it.tasks || [];
    const rate = rateOf(it);
    const taskRows = tasks.length
      ? tasks.map(t => {
        const tOff = t.enabled === false;
        return '<div class="task-item' + (tOff ? ' off' : '') + '">'
          + '<button type="button" class="task-name" data-tname="' + t.id + '">' + esc(t.title) + '</button>'
          + '<button type="button" class="switch sm" role="switch" data-tswitch="' + t.id + '"'
          + ' aria-checked="' + (!tOff) + '" aria-label="启用任务 ' + esc(t.title) + '" tabindex="0"></button>'
          + '<button type="button" class="task-del" data-tdel="' + t.id + '"'
          + ' aria-label="删除任务 ' + esc(t.title) + '" title="删除任务">' + ICON.trash + '</button>'
          + '</div>';
      }).join('')
      : '<div class="task-empty">暂无任务，点＋添加</div>';

    const panel = isOpen
      ? '<div class="task-panel" data-panel="' + it.id + '">' + taskRows
        + '<button type="button" class="task-add" data-tadd="' + it.id + '">＋ 添加任务</button></div>'
      : '';

    return '<div class="rule-block" data-block="' + it.id + '">'
      + '<div class="rule-row' + selCls + offCls + '" data-rule="' + it.id + '" role="button"'
      + ' tabindex="0" aria-label="编辑规则 ' + esc(it.title) + '">'
      + '<span class="circle">' + ICON.check + '</span>'
      + '<button type="button" class="caret' + (isOpen ? ' on' : '') + '" data-caret="' + it.id + '"'
      + ' aria-expanded="' + isOpen + '" aria-label="' + (isOpen ? '收起' : '展开') + '任务列表">' + ICON.caret + '</button>'
      + '<span class="rule-main" role="button" tabindex="0" aria-label="编辑规则 ' + esc(it.title) + '">'
      + '<span class="rule-name"><b>' + esc(it.title) + '</b>' + offTag + '</span>'
      + '<span class="rule-sum">' + esc(summaryOf(it)) + '</span>'
      + '</span>'
      + '<span class="rule-side">'
      + '<span class="task-count">' + tasks.length + ' 个任务</span>'
      + '<span class="rate ' + (rate.pct ? '' : 'zero') + '"><b>' + rate.pct + '%</b>'
      + rate.done + '/' + rate.total + ' 周期</span>'
      + swHtml
      + '</span>'
      + '</div>'
      + panel
      + '</div>';
  }).join('') || '<div class="rule-empty">还没有任何' + (cat === 'notebook' ? '笔记' : meta.title)
    + '，点右下角 + 新建一条</div>';

  // 悬浮按钮：选择态是删除，否则是新增
  fabBtn.classList.toggle('del', STATE.selecting);
  fabBtn.innerHTML = STATE.selecting ? ICON.trash : ICON.plus;
  const newLabel = '新增' + meta.title;
  fabBtn.setAttribute('aria-label', STATE.selecting ? '删除所选项' : newLabel);
  fabBtn.title = STATE.selecting ? '删除所选项' : newLabel;
  const badge = STATE.selecting && STATE.selected.size > 0
    ? '<span class="cnt">' + STATE.selected.size + '</span>' : '';
  fabBtn.insertAdjacentHTML('beforeend', badge);
  syncRulesChrome();
}

/** 管理页是独立覆盖层：工具条「＋」打开，左导航分 规则 / 记事 / 倒数日 / 笔记本 */
function openRules(cat) {
  if (cat) STATE.mgrCat = cat;
  STATE.selecting = false;
  STATE.selected.clear();
  $('#rulesScreen').hidden = false;
  renderRules();
}

function closeRules() {
  $('#rulesScreen').hidden = true;
  STATE.selecting = false;
  STATE.selected.clear();
  /* 悬浮 + 与三缸操作条的显隐由 syncRulesChrome 统一决定：
     漏掉这一步，FAB 会留在月历上继续浮着。 */
  syncRulesChrome();
}

/** 任何数据改动后的统一收尾：规则列表 + 月历一起重算 */
function afterChange() {
  renderRules();
  renderGrid();
  fitTagsInGrid();
  // 打卡面板开着时同步重绘：新增的任务要立刻出现在它所属的分组里
  if (!sheetMask.hidden) renderSheet();
}

/* 列表点击：箭头展开 / 任务行操作 / 选择态勾选 / 平时打开编辑规则弹窗 */
rulesListEl.addEventListener('click', e => {
  const caret = e.target.closest('[data-caret]');
  if (caret) {
    e.stopPropagation();
    const id = caret.dataset.caret;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderRules();
    return;
  }
  const tname = e.target.closest('[data-tname]');
  if (tname) {
    e.stopPropagation();
    openTaskEditor(tname.closest('.rule-block').dataset.block, tname.dataset.tname);
    return;
  }
  const tdel = e.target.closest('[data-tdel]');
  if (tdel) {
    e.stopPropagation();
    deleteTask(tdel.closest('.rule-block').dataset.block, tdel.dataset.tdel);
    return;
  }
  const tadd = e.target.closest('[data-tadd]');
  if (tadd) { e.stopPropagation(); openTaskEditor(tadd.dataset.tadd, null); return; }
  const tsw = e.target.closest('[data-tswitch]');
  if (tsw) {
    e.stopPropagation();
    toggleTaskEnabled(tsw.closest('.rule-block').dataset.block, tsw.dataset.tswitch);
    return;
  }
  const sw = e.target.closest('[data-switch]');
  if (sw) { e.stopPropagation(); toggleEnabled(sw.dataset.switch); return; }
  const row = e.target.closest('.rule-row');
  if (!row) return;
  // 选择态下所有分类都能点选/取消（之前 data-flat 的记事/倒数日/笔记点不动）
  if (STATE.selecting) { toggleSelect(row.dataset.rule); return; }
  // 笔记行走全屏书写页，其余类型仍用表单弹窗
  const target = findItem(row.dataset.rule);
  if (target && target.kind === 'notebook') { openBook(row.dataset.rule); return; }
  openEditor(row.dataset.rule);
});
rulesListEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target.closest('button')) { e.preventDefault(); e.target.click(); return; }
  const row = e.target.closest('.rule-row');
  if (!row) return;
  e.preventDefault();
  if (STATE.selecting) { toggleSelect(row.dataset.rule); return; }
  const target = findItem(row.dataset.rule);
  if (target && target.kind === 'notebook') { openBook(row.dataset.rule); return; }
  openEditor(row.dataset.rule);
});

/* 列表顶部筛选条：切换「全部 / 未分类 / 各分类」 */
$('#bookFilters').addEventListener('click', e => {
  const b = e.target.closest('[data-bookfilter]');
  if (!b) return;
  STATE.bookFilter = b.dataset.bookfilter;
  renderRules();
});

function toggleEnabled(id) {
  const it = findItem(id);
  if (!it) return;
  it.enabled = it.enabled === false;
  afterChange();
  showSnack(it.title + ' 已' + (it.enabled === false ? '停用' : '启用'));
}

function toggleTaskEnabled(ruleId, taskId) {
  const rule = findRule(ruleId);
  const task = rule && (rule.tasks || []).find(t => t.id === taskId);
  if (!task) return;
  task.enabled = task.enabled === false;
  afterChange();
  showSnack(task.title + ' 已' + (task.enabled === false ? '停用' : '启用'));
}

/** 删除任务：列表与月历同步消失，打卡记录一并清除 */
function deleteTask(ruleId, taskId) {
  const rule = findRule(ruleId);
  const task = rule && (rule.tasks || []).find(t => t.id === taskId);
  if (!task) return;
  confirmDialog({
    title: '删除任务「' + task.title + '」？',
    text: '该任务与它的打卡记录会一并移除，规则本身保留，无法撤销。',
    okText: '删除',
    onOk: () => {
      rule.tasks = rule.tasks.filter(t => t.id !== taskId);
      [...STATE.checkins.keys()].forEach(k => {
        if (k.split(':')[0] === taskId) STATE.checkins.delete(k);
      });
      afterChange();
      showSnack('已删除任务「' + task.title + '」');
    },
  });
}

function toggleSelect(id) {
  if (STATE.selected.has(id)) STATE.selected.delete(id); else STATE.selected.add(id);
  renderRules();
}

$('#btnSelect').onclick = () => {
  STATE.selecting = !STATE.selecting;
  STATE.selected.clear();
  renderRules();
};
/* 顶部已无独立「规则」按钮；openRules 仅作为内部跳转入口保留 */

/**
 * 当前分类下可被批量选中的条目。
 * 批量操作必须按分类作用域：在笔记本页全选/删除不能碰规则，
 * 反之在规则页也只删规则，绝不跨分类误删。
 */
function selectableItems() {
  const cat = STATE.mgrCat || 'rule';
  return cat === 'rule' ? allRules() : STATE.items.filter(it => it.kind === cat);
}

const CAT_NOUN = { rule: '规则', note: '记事', countdown: '倒数日', notebook: '笔记' };

/** 批量删除：只删当前分类里被选中的条目 */
function deleteSelected() {
  const cat = STATE.mgrCat || 'rule';
  const noun = CAT_NOUN[cat] || '条目';
  const scoped = selectableItems();
  // 只认当前分类里的 id，防止历史选择残留导致跨分类删除
  const ids = [...STATE.selected].filter(id => scoped.some(it => it.id === id));
  if (!ids.length) { showSnack('请先选择要删除的' + noun); return; }

  const names = ids.map(id => findItem(id)?.title).filter(Boolean);
  const isRuleCat = cat === 'rule';
  const nTask = isRuleCat ? ids.reduce((n, id) => n + ((findRule(id)?.tasks || []).length), 0) : 0;

  let text;
  if (ids.length === 1) {
    text = isRuleCat
      ? '将删除该规则及其 ' + nTask + ' 个任务（' + names.join('、') + '），对应的打卡记录一并清除，且无法撤销。'
      : '将删除该' + noun + '「' + names.join('、') + '」，无法撤销。' + (cat === 'notebook' ? '笔记正文会一并移除。' : '');
  } else {
    text = isRuleCat
      ? '将删除这 ' + ids.length + ' 条规则及其 ' + nTask + ' 个任务（' + names.join('、') + '），对应的打卡记录一并清除，且无法撤销。'
      : '将删除这 ' + ids.length + ' 条' + noun + '（' + names.join('、') + '），无法撤销。';
  }

  confirmDialog({
    title: '删除 ' + ids.length + ' 条' + noun + '？',
    text,
    okText: '删除',
    onOk: () => {
      const goneTasks = new Set();
      if (isRuleCat) ids.forEach(id => (findRule(id)?.tasks || []).forEach(t => goneTasks.add(t.id)));
      const gone = new Set(ids);
      STATE.items = STATE.items.filter(it => !gone.has(it.id));
      [...STATE.checkins.keys()].forEach(k => {
        const owner = k.split(':')[0];
        if (gone.has(owner) || goneTasks.has(owner)) STATE.checkins.delete(k);
      });
      if (isRuleCat) ids.forEach(id => expanded.delete(id));
      STATE.selected.clear();
      STATE.selecting = false;
      afterChange();
      showSnack('已删除 ' + ids.length + ' 条' + noun);
    },
  });
}

fabBtn.onclick = () => {
  if (STATE.selecting) { deleteSelected(); return; }
  const cat = STATE.mgrCat || 'rule';
  // 笔记本：直接进全屏书写页（空白新笔记），不再弹表单
  if (cat === 'notebook') { openBook(null); return; }
  openEditor(null, cat === 'rule' ? 'rule' : cat);
};
$('#selDel').onclick = deleteSelected;
$('#selAll').onclick = () => {
  const ids = selectableItems().map(it => it.id);
  if (ids.length && ids.every(id => STATE.selected.has(id))) STATE.selected.clear();
  else ids.forEach(id => STATE.selected.add(id));
  renderRules();
};
$('#selCancel').onclick = () => {
  STATE.selecting = false;
  STATE.selected.clear();
  renderRules();
};

/* ============================================================================
   20. 规则编辑弹窗（名称 / 类型 / 重复方式 / 提醒 / 保存 / 删除）
   ========================================================================= */
const editorDraft = { item: null, isNew: false, savedRepeat: null, lastMonthDay: null };

let idSeq = 0;
const uid = prefix => `${prefix}${Date.now().toString(36)}${(idSeq += 1).toString(36)}`;

/** 新规则 = 空的基础条件容器（任务在列表里点 ＋ 添加） */
function blankRule() {
  return {
    id: uid('r'), title: '', enabled: true,
    repeat: 'weekly', weekdays: [0], every: 30,
    monthDay: 20, yearMonth: 3, yearDay: 15,
    start: TODAY, end: null, repeatUntil: null,
    reminder: mkReminder('none', '09:00'),
    remindEveryDay: true,
    tasks: [],
  };
}

/**
 * 打开「编辑规则」：规则走完整表单，记事 / 倒数日沿用同一弹窗的精简分支。
 * presetKind 用于工具条「新建」选完类型后直接进对应表单（rule / note / countdown）。
 */
function openEditor(id, presetKind) {
  const isNew = !id;
  const src = isNew ? blankRule() : findItem(id);
  if (!src) return;
  editorDraft.item = JSON.parse(JSON.stringify(src));
  if (isNew && presetKind && presetKind !== 'rule') {
    editorDraft.item.kind = presetKind;
    editorDraft.item.repeat = 'none';
    editorDraft.item.weekdays = [];
    editorDraft.item.every = null;
  }
  /* 记事不强制选时间：新建时两处日期都留空 = 未排期；笔记本：根本没有日期 */
  if (isNew && presetKind === 'note') { editorDraft.item.start = ''; editorDraft.item.end = null; }
  if (!editorDraft.item.tasks && isRule(src)) editorDraft.item.tasks = [];
  // 深拷贝 + 迁移：旧数据的单值 mode 在这里就地转成 notify / alarm 两个布尔
  const srcRem = src.reminder || mkReminder('none', '09:00');
  const srcCh = channelsOf(srcRem);
  editorDraft.item.reminder = {
    notify: srcCh.notify, alarm: srcCh.alarm,
    time: srcRem.time || '09:00',
    notifyText: srcRem.notifyText || '',
    snooze: Boolean(srcRem.snooze),
    notifyTouched: Boolean(srcRem.notifyTouched),
  };
  editorDraft.isNew = isNew;
  editorDraft.savedRepeat = null;
  editorDraft.notifyTouched = Boolean(editorDraft.item.reminder.notifyTouched);
  renderEditor();
  dialogMask.hidden = false;
  pushLayer(closeEditor);
  $('#d_title')?.focus();
}

function closeEditor() {
  dialogMask.hidden = true;
  dialogMask.innerHTML = '';
  editorDraft.item = null;
  popLayer(closeEditor);
}

function renderEditor() {
  const it = editorDraft.item;
  if (!it) return;
  const r = it.reminder;
  const isRuleEdit = isRule(it);
  const isNote = it.kind === 'note';
  const isCountdown = it.kind === 'countdown';
  const taskCount = isRuleEdit ? (it.tasks || []).length : 0;

  // 类型不在表单里显示：当前在管理页哪个分类，就建哪一类
  const curKind = isRuleEdit ? 'rule' : it.kind;
  const KIND_CN2 = { rule: '规则', note: '记事', countdown: '倒数日' };

  const curRepeat = it.repeat || 'none';
  const repeatSeg = `<div class="segbox segwrap" data-seg="repeat">
    ${[['weekly', '每周'], ['every', '每 N 天'], ['monthly', '每月'], ['yearly', '每年'], ['none', '不重复']].map(([v, t]) =>
      `<button type="button" data-v="${v}" class="${curRepeat === v ? 'on' : ''}">${t}</button>`).join('')}
  </div>`;

  const chips = `<div class="chips" data-chips="weekdays">
    ${WEEK_CN.map((w, i) => `<button type="button" class="chip ${(it.weekdays || []).includes(i) ? 'on' : ''}"
      data-dow="${i}">周${w}</button>`).join('')}
  </div>`;

  /* 提醒：不提醒是互斥项，通知 / 闹钟可叠加；两个都关时「不提醒」自动点亮 */
  const ch = channelsOf(r);
  const remindSeg = `<div class="segbox" data-seg="remind">
    <button type="button" data-v="none" class="${!ch.notify && !ch.alarm ? 'on' : ''}">不提醒</button>
    <button type="button" data-v="notify" aria-pressed="${ch.notify}" class="${ch.notify ? 'on' : ''}">通知</button>
    <button type="button" data-v="alarm" aria-pressed="${ch.alarm}" class="${ch.alarm ? 'on' : ''}">闹钟</button>
  </div>
  <div class="hint">通知与闹钟可以同时开；不提醒会关掉两者。</div>`;

  const notifyBox = ch.notify ? `
    <input class="inp" id="d_notifyText" data-notify-box placeholder="该打卡了：${esc(it.title || '任务名')}"
           value="${esc(r.notifyText || '')}" />
    <div class="hint">可自定义，留空则用「该打卡了：任务名」。通知会在当天到点弹出，不打断当前操作。</div>` : '';

  const alarmBox = ch.alarm ? `
    <div class="pair">
      <input class="inp" id="d_alarmTime" type="time" value="${esc(r.time || '09:00')}" />
      <span>贪睡</span>
      <button type="button" class="switch" role="switch" data-switch="snooze"
              aria-checked="${r.snooze ? 'true' : 'false'}" aria-label="贪睡" tabindex="0"></button>
    </div>
    <div class="hint">闹钟到点会以置顶窗口 / 全屏形式提醒；闹钟界面提供「贪睡 5 分钟」按钮（形式见设置 → 提醒）。</div>` : '';

  const remindEvery = !ch.notify && !ch.alarm ? '' : `
    <div class="frow">
      <span class="lb">每日提醒</span>
      <div class="fc" style="flex-direction:row;align-items:center;justify-content:space-between">
        <span class="hint" style="max-width:330px">开启后，周期内每一个命中日都提醒一次；关闭则只在每个周期的第一天提醒。</span>
        <button type="button" class="switch" role="switch" data-switch="everyday"
                aria-checked="${it.remindEveryDay ? 'true' : 'false'}" aria-label="每个重复日都提醒" tabindex="0"></button>
      </div>
    </div>`;

  dialogMask.innerHTML = `
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <div class="dialog-head">
        <h3 id="dTitle">${editorDraft.isNew ? '新建' + (KIND_CN2[curKind] || '规则') : '编辑' + (KIND_CN2[curKind] || '规则')}</h3>
        <p>${isCountdown ? '倒数日不进入日历格子，只算与今天的天数差'
          : isNote ? '日期可留空；填了结束日期就是一段时间段，时段内每天都出现在日历上'
          : '改完保存，月历立即按新规则重算'}</p>
      </div>
      <div class="dialog-body">
        <div class="frow">
          <label for="d_title">名称</label>
          <div class="fc"><input class="inp" id="d_title" placeholder="${isNote ? '例如：交房租' : isCountdown ? '例如：纪念日' : '例如：健身'}" value="${esc(it.title)}" /></div>
        </div>
        ${isNote ? `
          <div class="frow">
            <label for="d_date">日期</label>
            <div class="fc"><input class="inp" id="d_date" type="date" value="${esc(it.start || '')}" /></div>
          </div>
          <div class="frow">
            <label for="d_end">结束日期</label>
            <div class="fc">
              <input class="inp" id="d_end" type="date" value="${esc(it.end || '')}" />
              <div class="hint">结束日期留空表示只在当天；两处都留空则不排期。</div>
            </div>
          </div>
          <div class="frow">
            <label for="d_content">正文</label>
            <div class="fc"><input class="inp" id="d_content" placeholder="记事内容" value="${esc(it.content || '')}" /></div>
          </div>` : ''}

        ${isCountdown ? `
          <div class="frow">
            <label for="d_date">目标日</label>
            <div class="fc">
              <input class="inp" id="d_date" type="date" value="${esc(it.start)}" />
              <div class="hint">按目标日与今天的天数差显示「还有 N 天 / 已经 N 天」。</div>
            </div>
          </div>
          <div class="frow">
            <label for="d_content">备注</label>
            <div class="fc"><input class="inp" id="d_content" placeholder="可选" value="${esc(it.content || '')}" /></div>
          </div>` : ''}

        ${isRuleEdit ? `
          <div class="frow">
            <span class="lb">任务</span>
            <div class="fc"><div class="hint" data-task-countline>
              该规则下有 ${taskCount} 个任务；重复与提醒对全部任务共享，任务名在列表里点箭头展开后添加/编辑。
            </div></div>
          </div>

          <div class="frow">
            <span class="lb">重复方式</span>
            <div class="fc">${repeatSeg}</div>
          </div>

          ${(it.repeat || 'none') === 'weekly' ? `
            <div class="frow">
              <span class="lb">星期几</span>
              <div class="fc">${chips}</div>
            </div>` : ''}

          ${curRepeat === 'every' ? `
            <div class="frow">
              <label for="d_every">每隔</label>
              <div class="fc"><div class="pair">
                <input class="inp" id="d_every" type="number" min="1" max="${EVERY_MAX}" value="${clampEvery(it.every || 3)}" />
                <span>天（从开始日期起算，最长 ${EVERY_MAX} 天）</span>
              </div>
              <div class="chips" data-chips="every">
                ${EVERY_PRESETS.map(n => `<button type="button" class="chip ${clampEvery(it.every) === n ? 'on' : ''}" data-every="${n}">${n} 天</button>`).join('')}
              </div>
              <div class="hint">快捷预设点一下即填入；周期长的频率（如 365 天）也走这里。</div>
              </div>
            </div>` : ''}

          ${curRepeat === 'monthly' ? `
            <div class="frow">
              <label for="d_monthDay">每月</label>
              <div class="fc">
                <div class="pair">
                  <input class="inp" id="d_monthDay" type="number" min="1" max="31"
                         value="${it.monthDay === 'last' ? 20 : parseMonthDay(it.monthDay || 20)}"
                         ${it.monthDay === 'last' ? 'disabled' : ''} ${it.monthDay === 'last' ? 'aria-disabled="true"' : ''} />
                  <span>${it.monthDay === 'last' ? '日（已被「每月最后一天」接管）' : '日'}</span>
                </div>
                <div class="frow-inline">
                  <span class="hint">每月最后一天</span>
                  <button type="button" class="switch" role="switch" data-switch="monthLast"
                          aria-checked="${it.monthDay === 'last' ? 'true' : 'false'}" aria-label="每月最后一天" tabindex="0"></button>
                </div>
                <div class="hint">每月 31 日在小月会落在该月最后一天；2 月落在 28 / 29 日。</div>
              </div>
            </div>` : ''}

          ${curRepeat === 'yearly' ? `
            <div class="frow">
              <label for="d_yearMonth">每年</label>
              <div class="fc">
                <div class="pair">
                  <input class="inp" id="d_yearMonth" type="number" min="1" max="12" value="${parseYearMonth(it.yearMonth || 3)}" />
                  <span>月</span>
                  <input class="inp" id="d_yearDay" type="number" min="1" max="31" value="${parseYearDay(it.yearDay || 15)}" />
                  <span>日</span>
                </div>
                <div class="hint">2 月 29 日在平年会落在 2 月 28 日；其余月份按当月天数钳制。</div>
              </div>
            </div>` : ''}

          ${(it.repeat || 'none') !== 'none' ? `
            <div class="frow">
              <label for="d_start">时间范围</label>
              <div class="fc"><div class="pair">
                <input class="inp" id="d_start" type="date" value="${esc(it.start)}" />
                <span>到</span>
                <input class="inp" id="d_end" type="date" value="${esc(it.repeatUntil || it.end || '')}" />
              </div><div class="hint">结束日期留空表示不限。</div></div>
            </div>` : `
            <div class="frow">
              <label for="d_start">日期</label>
              <div class="fc"><input class="inp" id="d_start" type="date" value="${esc(it.start)}" /></div>
            </div>`}

          <div class="frow">
            <span class="lb">提醒</span>
            <div class="fc">${remindSeg}${notifyBox}${alarmBox}</div>
          </div>
          ${remindEvery}` : ''}
      </div>
      <div class="dialog-foot">
        ${editorDraft.isNew ? '' : '<button type="button" class="btn danger" data-act="del">删除</button>'}
        <div style="flex:1"></div>
        <button type="button" class="btn" data-act="cancel">取消</button>
        <button type="button" class="btn primary" data-act="save">保存</button>
      </div>
    </div>`;

  bindEditor();
}

/* 编辑器事件：所有控件改动只写草稿，保存时才落库 */
function bindEditor() {
  const it = editorDraft.item;

  const titleInp = $('#d_title');
  titleInp.addEventListener('input', e => {
    it.title = e.target.value;
    if (channelsOf(it.reminder).notify && !editorDraft.notifyTouched) {
      it.reminder.notifyText = it.title ? `该打卡了：${it.title}` : '';
      const box = $('#d_notifyText');
      if (box) box.value = it.reminder.notifyText;
    }
  });

  $$('[data-seg]', dialogMask).forEach(seg => {
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button[data-v]');
      if (!btn) return;
      const kind = seg.dataset.seg;
      /* 类型已不由表单切换：规则 / 记事 / 倒数日 由管理页左侧导航决定，这里只处理重复与提醒 */
      if (kind === 'repeat') {
        it.repeat = btn.dataset.v;
        if (it.repeat === 'weekly' && !(it.weekdays || []).length) it.weekdays = [0];
        if (it.repeat === 'monthly' && it.monthDay == null) it.monthDay = 20;
        if (it.repeat === 'yearly') {
          if (it.yearMonth == null) it.yearMonth = 3;
          if (it.yearDay == null) it.yearDay = 15;
        }
      } else if (kind === 'remind') {
        const r = it.reminder;
        const cur = channelsOf(r);
        if (btn.dataset.v === 'none') {
          // 互斥项：一次关掉两个通道
          r.notify = false; r.alarm = false;
        } else {
          const ch = btn.dataset.v;                      // notify | alarm
          const next = !cur[ch];
          r.notify = ch === 'notify' ? next : cur.notify;
          r.alarm  = ch === 'alarm'  ? next : cur.alarm;
          // 刚打开通知：没有文案就按任务名生成，并重新跟随名称变化
          if (r.notify && !r.notifyText) {
            r.notifyText = it.title ? `该打卡了：${it.title}` : '';
            editorDraft.notifyTouched = Boolean(r.notifyTouched);
          }
        }
      }
      renderEditor();
    });
  });

  $$('[data-chips="weekdays"] .chip', dialogMask).forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.dow;
      const set = new Set(it.weekdays || []);
      if (set.has(i)) set.delete(i); else set.add(i);
      it.weekdays = [...set].sort((a, b) => a - b);
      renderEditor();
    });
  });

  $$('[data-switch]', dialogMask).forEach(sw => {
    const flip = () => {
      const on = sw.getAttribute('aria-checked') !== 'true';
      sw.setAttribute('aria-checked', String(on));
      if (sw.dataset.switch === 'snooze') it.reminder.snooze = on;
      if (sw.dataset.switch === 'everyday') it.remindEveryDay = on;
      if (sw.dataset.switch === 'monthLast') {
        // 勾上 = 每月最后一天；取消则还原回上一次的具体日（默认 20），日输入框重新可用
        if (on) {
          editorDraft.lastMonthDay = it.monthDay === 'last' ? (editorDraft.lastMonthDay || 20) : it.monthDay;
          it.monthDay = 'last';
        } else {
          it.monthDay = editorDraft.lastMonthDay || 20;
        }
        renderEditor();
      }
    };
    sw.addEventListener('click', flip);
    sw.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
  });

  // 数字输入统一体验：聚焦即全选，直接打字就是覆盖旧值（否则 30 改成 8 会变成 308）
  const selectAllOnFocus = inp => {
    if (!inp) return;
    inp.addEventListener('focus', () => {
      requestAnimationFrame(() => { try { inp.select(); } catch (_) {} });
    });
    inp.addEventListener('click', () => { try { inp.select(); } catch (_) {} });
  };

  const everyInp = $('#d_every');
  if (everyInp) everyInp.addEventListener('input', e => {
    it.every = clampEvery(e.target.value);
  });
  selectAllOnFocus(everyInp);
  $$('[data-chips="every"] .chip', dialogMask).forEach(btn => {
    btn.addEventListener('click', () => {
      it.every = clampEvery(btn.dataset.every);
      renderEditor();                    // 重渲染后输入框显示新值，预设同步高亮
    });
  });
  const monthDayInp = $('#d_monthDay');
  if (monthDayInp) monthDayInp.addEventListener('input', e => {
    it.monthDay = parseMonthDay(e.target.value);
    if (it.monthDay !== 'last') editorDraft.lastMonthDay = it.monthDay;
  });
  selectAllOnFocus(monthDayInp);
  const yearMonthInp = $('#d_yearMonth');
  if (yearMonthInp) yearMonthInp.addEventListener('input', e => {
    it.yearMonth = parseYearMonth(e.target.value);
  });
  selectAllOnFocus(yearMonthInp);
  const yearDayInp = $('#d_yearDay');
  if (yearDayInp) yearDayInp.addEventListener('input', e => {
    it.yearDay = parseYearDay(e.target.value);
  });
  selectAllOnFocus(yearDayInp);
  const startInp = $('#d_start');
  if (startInp) startInp.addEventListener('change', e => { it.start = e.target.value || it.start; });
  /* 记事的「结束日期」与规则的「时间范围结束」共用 #d_end，语义按类型分流 */
  const endInp = $('#d_end');
  if (endInp) endInp.addEventListener('change', e => {
    if (it.kind === 'note') { it.end = e.target.value || null; return; }
    it.repeatUntil = e.target.value || null;
    it.end = null;
  });
  const dateInp = $('#d_date');
  if (dateInp) dateInp.addEventListener('change', e => {
    // 记事允许留空（= 不排期）；倒数日的目标日不允许留空，清空则还原旧值
    it.start = it.kind === 'note' ? e.target.value : (e.target.value || it.start);
    if (it.kind === 'note' && !it.start) it.end = null;
  });
  const contentInp = $('#d_content');
  if (contentInp) contentInp.addEventListener('input', e => { it.content = e.target.value; });
  const notifyInp = $('#d_notifyText');
  if (notifyInp) notifyInp.addEventListener('input', e => {
    it.reminder.notifyText = e.target.value;
    // 手改后不再跟随名称；清空则视为恢复默认跟随
    editorDraft.notifyTouched = e.target.value !== '';
    it.reminder.notifyTouched = editorDraft.notifyTouched;
  });
  const alarmInp = $('#d_alarmTime');
  if (alarmInp) alarmInp.addEventListener('change', e => { it.reminder.time = e.target.value || '09:00'; });

  $('[data-act="cancel"]', dialogMask).onclick = closeEditor;
  $('[data-act="save"]', dialogMask).onclick = saveEditor;
  const del = $('[data-act="del"]', dialogMask);
  if (del) del.onclick = () => {
    const target = editorDraft.item;
    const nTask = isRule(target) ? (target.tasks || []).length : 0;
    const taskText = nTask > 0 ? `将删除该规则及其 ${nTask} 个任务` : '该规则';
    confirmDialog({
      title: `删除「${target.title || '未命名'}」？`,
      text: `${taskText}，对应的打卡记录一并清除，无法撤销。`,
      okText: '删除',
      onOk: () => {
        const gone = new Set((isRule(target) ? (target.tasks || []) : []).map(t => t.id));
        STATE.items = STATE.items.filter(x => x.id !== target.id);
        [...STATE.checkins.keys()].forEach(k => {
          const owner = k.split(':')[0];
          if (owner === target.id || gone.has(owner)) STATE.checkins.delete(k);
        });
        expanded.delete(target.id);
        closeEditor();
        afterChange();
        showSnack('已删除 1 条规则');
      },
    });
  };
  dialogMask.onclick = e => { if (e.target === dialogMask) closeEditor(); };
}

function saveEditor() {
  const it = editorDraft.item;
  if (!it) return;
  const title = (it.title || '').trim();
  if (!title) { showSnack('请先填写名称'); $('#d_title')?.focus(); return; }
  it.title = title;
  // 提醒落库前统一成 notify / alarm 两个布尔，避免旧 mode 字段回流
  const chSave = channelsOf(it.reminder);
  it.reminder = {
    notify: chSave.notify, alarm: chSave.alarm,
    time: (it.reminder && it.reminder.time) || '09:00',
    notifyText: (it.reminder && it.reminder.notifyText) || '',
    snooze: Boolean(it.reminder && it.reminder.snooze),
    notifyTouched: Boolean(it.reminder && it.reminder.notifyTouched),
  };
  if (isRule(it)) {
    if ((it.repeat || 'none') === 'weekly' && !(it.weekdays || []).length) {
      showSnack('每周重复至少要选一天'); return;
    }
    it.tasks = it.tasks || [];
  } else {
    it.repeat = 'none'; it.weekdays = []; it.every = null;
    if (it.kind === 'note') {
      // 结束日期早于开始日期、或没填开始日期时，退回单日 / 未排期
      if (!it.start || !it.end || it.end <= it.start) it.end = null;
    }
  }

  const idx = STATE.items.findIndex(x => x.id === it.id);
  const isNew = idx < 0;
  if (idx >= 0) {
    STATE.items[idx] = it;
  } else if (isRule(it)) {
    // 新规则插到「规则段」末尾，落在记事 / 倒数日之前，列表顺序不跳
    const firstFlat = STATE.items.findIndex(x => !isRule(x));
    if (firstFlat < 0) STATE.items.push(it);
    else STATE.items.splice(firstFlat, 0, it);
  } else {
    STATE.items.push(it);
  }

  closeEditor();
  afterChange();
  showSnack(isNew ? `已新增「${it.title}」` : `已保存「${it.title}」`);
}

/* ============================================================================
   20.1 任务编辑弹窗（规则下的一级：名称 + 启用开关 + 删除）
   ========================================================================= */
const taskDraft = { ruleId: null, taskId: null, title: '', enabled: true, isNew: false };

/** taskId 为空 = 新增模式；否则编辑该规则下的任务 */
function openTaskEditor(ruleId, taskId) {
  const rule = findRule(ruleId);
  if (!rule) return;
  const isNew = !taskId;
  const src = isNew ? null : (rule.tasks || []).find(t => t.id === taskId);
  if (!isNew && !src) return;
  taskDraft.ruleId = ruleId;
  taskDraft.taskId = isNew ? null : taskId;
  taskDraft.title = isNew ? '' : src.title;
  taskDraft.enabled = isNew ? true : src.enabled !== false;
  taskDraft.isNew = isNew;
  renderTaskEditor();
  dialogMask.hidden = false;
  pushLayer(closeTaskEditor);
  $('#t_title')?.focus();
}

function closeTaskEditor() {
  dialogMask.hidden = true;
  dialogMask.innerHTML = '';
  dialogMask.onclick = null;
  popLayer(closeTaskEditor);
}

function renderTaskEditor() {
  const rule = findRule(taskDraft.ruleId);
  if (!rule) return;
  dialogMask.innerHTML = `
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="tTitle" style="max-width:420px">
      <div class="dialog-head">
        <h3 id="tTitle">${taskDraft.isNew ? '新建任务' : '编辑任务'}</h3>
        <p>属于规则「${esc(rule.title)}」· 重复与提醒跟随规则，这里只管名称与启停</p>
      </div>
      <div class="dialog-body">
        <div class="frow">
          <label for="t_title">名称</label>
          <div class="fc"><input class="inp" id="t_title" placeholder="例如：拉伸"
                 value="${esc(taskDraft.title)}" /></div>
        </div>
        <div class="frow">
          <span class="lb">启用</span>
          <div class="fc" style="flex-direction:row;align-items:center;justify-content:space-between">
            <span class="hint">关闭后该任务不在月历与打卡面板出现，打卡记录保留。</span>
            <button type="button" class="switch" role="switch" data-tsw
                    aria-checked="${taskDraft.enabled}" aria-label="启用任务" tabindex="0"></button>
          </div>
        </div>
      </div>
      <div class="dialog-foot">
        ${taskDraft.isNew ? '' : '<button type="button" class="btn danger" data-act="del">删除</button>'}
        <div style="flex:1"></div>
        <button type="button" class="btn" data-act="cancel">取消</button>
        <button type="button" class="btn primary" data-act="save">保存</button>
      </div>
    </div>`;

  const titleInp = $('#t_title');
  titleInp.addEventListener('input', e => { taskDraft.title = e.target.value; });
  titleInp.addEventListener('keydown', e => { if (e.key === 'Enter') saveTaskEditor(); });

  const sw = $('[data-tsw]', dialogMask);
  const flip = () => {
    taskDraft.enabled = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(taskDraft.enabled));
  };
  sw.addEventListener('click', flip);
  sw.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });

  $('[data-act="cancel"]', dialogMask).onclick = closeTaskEditor;
  $('[data-act="save"]', dialogMask).onclick = saveTaskEditor;
  const del = $('[data-act="del"]', dialogMask);
  if (del) del.onclick = () => {
    const ruleId = taskDraft.ruleId;
    const taskId = taskDraft.taskId;
    closeTaskEditor();
    deleteTask(ruleId, taskId);
  };
  dialogMask.onclick = e => { if (e.target === dialogMask) closeTaskEditor(); };
}

function saveTaskEditor() {
  const rule = findRule(taskDraft.ruleId);
  if (!rule) { closeTaskEditor(); return; }
  const title = (taskDraft.title || '').trim();
  if (!title) { showSnack('任务名不能为空'); $('#t_title')?.focus(); return; }
  const dup = (rule.tasks || []).some(t => t.id !== taskDraft.taskId && t.title.trim() === title);
  if (dup) { showSnack('同一规则下任务名不能重复'); $('#t_title')?.focus(); return; }

  rule.tasks = rule.tasks || [];
  if (taskDraft.isNew) {
    rule.tasks.push({ id: uid('t'), title, enabled: taskDraft.enabled !== false });
    expanded.add(rule.id);
  } else {
    const t = rule.tasks.find(x => x.id === taskDraft.taskId);
    if (!t) { closeTaskEditor(); return; }
    t.title = title;
    t.enabled = taskDraft.enabled !== false;
  }
  closeTaskEditor();
  afterChange();
  showSnack(taskDraft.isNew ? `已新增任务「${title}」` : `已保存任务「${title}」`);
}



/* ============================================================================
   20.1 笔记本（列表 → 全屏书写）：两态（列表 / 编辑器）+ 分类
   ----------------------------------------------------------------------------
   编辑器是盖在管理页之上的整页白底（section.screen），不是弹框；
   标题与正文变动后 600ms 静默写回 STATE，返回列表立刻看到最新摘要。
   ========================================================================= */
const bookScreen = $('#bookScreen');
const bookTitleEl = $('#bookTitle');
const bookBodyEl = $('#bookBody');
const bookWordsEl = $('#bookWords');
const bookTimeEl = $('#bookTime');
const bookCatBtn = $('#bookCat');
const bookMoreBtn = $('#bookMore');
const bookMenuEl = $('#bookMenu');
const bookThinkBtn = $('#bookThink');
const bookPickerMask = $('#bookPickerMask');
const bookPickerList = $('#bookPickerList');
const bookPickerNew = $('#bookPickerNew');

/** 笔记的分类：缺字段一律归「未分类」（旧数据也能用） */
function categoryOf(item) {
  return (item && item.category) || BOOK_CAT_NONE;
}

/** 编辑器里正在写的这条笔记（未写入 STATE 的新笔记也先在内存里） */
const bookDraft = { isNew: false, item: null, timer: 0 };

/** 时间戳 → 元信息行文案：10月21日 下午2:29 */
function bookStamp(item) {
  const d = item && item.createdAt ? new Date(item.createdAt) : new Date();
  const h = d.getHours();
  const ampm = h < 12 ? '上午' : '下午';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + ampm + h12 + ':' + pad2(d.getMinutes());
}

/** 正文字数（空白不计），元信息行实时更新 */
function bookWordCount(s) {
  return String(s || '').replace(/\s/g, '').length;
}

function renderBookMeta() {
  const it = bookDraft.item;
  if (!it) return;
  bookTimeEl.textContent = bookStamp(it);
  bookWordsEl.textContent = bookWordCount(bookBodyEl.value) + ' 字';
}

/** 正文为空时才露出「≡ 创建思维笔记」（原型未实现 → 按钮本身禁用） */
function syncBookThink() {
  bookThinkBtn.hidden = bookBodyEl.value.trim() !== '';
}

// 分类 chip 文案随当前分类走
function renderBookChip() {
  const cat = bookDraft.item ? categoryOf(bookDraft.item) : BOOK_CAT_NONE;
  bookCatBtn.innerHTML = ICON.folder + esc(cat);
  bookCatBtn.setAttribute('aria-label', '分类：' + cat + '，点击切换');
}

/** 打开编辑器：id 为空 = 新建空白笔记 */
function openBook(id) {
  const isNew = !id;
  const src = isNew ? null : findItem(id);
  const item = src
    ? JSON.parse(JSON.stringify(src))
    : { id: null, kind: 'notebook', title: '', enabled: true, start: '', content: '', category: BOOK_CAT_NONE };
  bookDraft.isNew = isNew;
  bookDraft.item = item;
  if (!item.category) item.category = BOOK_CAT_NONE;
  if (!item.createdAt) item.createdAt = new Date().toISOString();

  bookTitleEl.textContent = item.title || '';
  bookBodyEl.value = item.content || '';
  renderBookChip();
  syncBookThink();
  renderBookMeta();
  autoGrowBook();

  bookMenuEl.hidden = true;
  bookMoreBtn.setAttribute('aria-expanded', 'false');
  bookPickerMask.hidden = true;

  bookScreen.hidden = false;
  document.body.classList.add('book-open');
  pushLayer(closeBook);
  syncRulesChrome();
  // 新建：标题优先；已有笔记：正文优先（与手机备忘录一致）
  (isNew ? bookTitleEl : bookBodyEl).focus();
}

/** 返回列表：先落盘，再收起编辑器 */
function closeBook() {
  flushBook();
  cancelBookTimer();
  bookMenuEl.hidden = true;
  bookMoreBtn.setAttribute('aria-expanded', 'false');
  bookPickerMask.hidden = true;
  popLayer(closeBookPicker);          // 分类层没关就返回时，别把它的 Esc 层留在栈里
  bookScreen.hidden = true;
  document.body.classList.remove('book-open');
  popLayer(closeBook);
  bookDraft.item = null;
  bookDraft.isNew = false;
  renderRules();
  syncRulesChrome();
}

function cancelBookTimer() {
  if (bookDraft.timer) { clearTimeout(bookDraft.timer); bookDraft.timer = 0; }
}

/** 标题或正文变动 → 600ms 后静默保存（不弹 toast） */
function scheduleBookSave() {
  cancelBookTimer();
  bookDraft.timer = setTimeout(() => { bookDraft.timer = 0; flushBook(); }, 600);
}

/** 把草稿写回 STATE；无内容的新笔记不落地，避免留下空壳 */
function flushBook() {
  const it = bookDraft.item;
  if (!it) return;
  it.title = (bookTitleEl.textContent || '').replace(/\n/g, ' ').trim();
  it.content = bookBodyEl.value;
  if (!it.title && !it.content.trim()) {
    if (bookDraft.isNew) return;              // 空白新笔记：不写入列表
  }
  if (!it.category) it.category = BOOK_CAT_NONE;

  const idx = STATE.items.findIndex(x => x.id === it.id);
  if (idx >= 0) {
    STATE.items[idx] = it;
  } else {
    it.id = it.id || uid('nb');
    bookDraft.isNew = false;
    STATE.items.push(it);
  }
  registerCategory(it.category);
}

/** 分类名登记到 notebookCategories（未分类不登记） */
function registerCategory(name) {
  const c = String(name || '').trim();
  if (!c || c === BOOK_CAT_NONE) return;
  if (!STATE.notebookCategories.includes(c)) STATE.notebookCategories.push(c);
}

/** 正文 textarea 跟随内容长高，滚动交给外层 .be-scroll */
function autoGrowBook() {
  bookBodyEl.style.height = 'auto';
  bookBodyEl.style.height = Math.max(bookBodyEl.scrollHeight, 200) + 'px';
}

/* ---- 编辑器的输入 / 自动保存 ---- */
bookTitleEl.addEventListener('input', () => {
  // 清空后浏览器会留下 <br>，:empty 占位就失效：这里把空内容规整掉
  if (!bookTitleEl.textContent.trim() && bookTitleEl.innerHTML) bookTitleEl.innerHTML = '';
  scheduleBookSave();
});
bookTitleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); bookBodyEl.focus(); }
});
bookBodyEl.addEventListener('input', () => {
  autoGrowBook();
  renderBookMeta();
  syncBookThink();
  scheduleBookSave();
});

/* ---- 顶栏：返回 / 更多 ---- */
$('#bookBack').onclick = closeBook;
bookMoreBtn.onclick = e => {
  e.stopPropagation();
  const open = bookMenuEl.hidden;
  bookMenuEl.hidden = !open;
  bookMoreBtn.setAttribute('aria-expanded', String(open));
};
bookMenuEl.addEventListener('click', e => {
  const b = e.target.closest('[data-bmenu]');
  if (!b) return;
  bookMenuEl.hidden = true;
  bookMoreBtn.setAttribute('aria-expanded', 'false');
  if (b.dataset.bmenu === 'cats') { openBookPicker(); return; }
  if (b.dataset.bmenu === 'del') { deleteBookNote(); return; }
  if (b.dataset.bmenu === 'copy') { copyBookBody(); return; }
});
document.addEventListener('click', e => {
  if (bookMenuEl.hidden) return;
  if (e.target.closest('.be-more')) return;
  bookMenuEl.hidden = true;
  bookMoreBtn.setAttribute('aria-expanded', 'false');
});

function copyBookBody() {
  const text = bookBodyEl.value;
  if (!text.trim()) { showSnack('正文为空，没有可复制的内容'); return; }
  const done = () => showSnack('已复制正文 ' + bookWordCount(text) + ' 字');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) { /* 忽略：无剪贴板权限 */ }
    ta.remove();
    done();
  }
}

function deleteBookNote() {
  const it = bookDraft.item;
  if (!it) return;
  if (bookDraft.isNew || STATE.items.every(x => x.id !== it.id)) {
    showSnack('这条笔记还没保存，直接返回即可');
    return;
  }
  confirmDialog({
    title: '删除「' + (it.title || '无标题笔记') + '」？',
    text: '删除后这条笔记与其正文一并移除，无法撤销。',
    okText: '删除',
    onOk: () => {
      STATE.items = STATE.items.filter(x => x.id !== it.id);
      bookScreen.hidden = true;
      document.body.classList.remove('book-open');
      popLayer(closeBookPicker);
      popLayer(closeBook);
      bookDraft.item = null;
      bookDraft.isNew = false;
      renderRules();
      syncRulesChrome();
      showSnack('已删除笔记「' + (it.title || '无标题笔记') + '」');
    },
  });
}

/* ---- 分类选择层 ---- */
function renderBookPicker(creating, renaming) {
  const cur = bookDraft.item ? categoryOf(bookDraft.item) : BOOK_CAT_NONE;
  const cats = [...new Set([BOOK_CAT_NONE, ...STATE.notebookCategories])];
  bookPickerList.innerHTML = cats.map(c => {
    if (renaming === c) {
      return '<div class="book-cat-row editing">'
        + '<input class="inp" id="bookRenameInput" maxlength="20" value="' + esc(c) + '" />'
        + '<button type="button" class="bk-act ok" data-reok="' + esc(c) + '">确定</button>'
        + '<button type="button" class="bk-act" data-rcancel="1">取消</button>'
        + '</div>';
    }
    const isDefault = c === BOOK_CAT_NONE;
    return '<div class="book-cat-row' + (c === cur ? ' on' : '') + '">'
      + '<button type="button" class="book-cat' + (c === cur ? ' on' : '') + '" data-bookcat="' + esc(c) + '"'
      + ' aria-pressed="' + (c === cur) + '">'
      + '<span class="bk-ico">' + ICON.folder + '</span>' + esc(c)
      + '<span class="bk-tick">' + (c === cur ? ICON.check : '') + '</span></button>'
      + (isDefault ? ''
        : '<button type="button" class="bk-act" data-ren="' + esc(c) + '" aria-label="重命名分类 ' + esc(c) + '" title="重命名">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3Z"/></svg></button>'
        + '<button type="button" class="bk-act danger" data-del="' + esc(c) + '" aria-label="删除分类 ' + esc(c) + '" title="删除分类">'
          + ICON.trash + '</button>')
      + '</div>';
  }).join('');

  bookPickerNew.innerHTML = creating
    ? '<input class="inp" id="bookNewCatInput" maxlength="20" placeholder="新分类名，最多 20 字" />'
      + '<button type="button" class="btn primary" id="bookNewCatOk" style="flex:none;height:38px">确认</button>'
      + '<button type="button" class="btn" id="bookNewCatCancel" style="flex:none;height:38px">取消</button>'
    : '<button type="button" class="book-picker-newbtn" id="bookNewCat">＋ 新建分类</button>';

  if (creating) {
    const inp = $('#bookNewCatInput');
    const ok = () => createBookCategory(inp.value);
    $('#bookNewCatOk').onclick = ok;
    $('#bookNewCatCancel').onclick = () => renderBookPicker(false);
    inp.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); ok(); }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); renderBookPicker(false); }
    };
    inp.focus();
  } else {
    $('#bookNewCat').onclick = () => renderBookPicker(true);
  }
}

function openBookPicker() {
  if (!bookDraft.item) return;
  renderBookPicker(false);
  bookPickerMask.hidden = false;
  bookCatBtn.setAttribute('aria-expanded', 'true');
  pushLayer(closeBookPicker);
}

function closeBookPicker() {
  bookPickerMask.hidden = true;
  bookPickerNew.innerHTML = '<button type="button" class="book-picker-newbtn" id="bookNewCat">＋ 新建分类</button>';
  $('#bookNewCat').onclick = () => renderBookPicker(true);
  bookCatBtn.setAttribute('aria-expanded', 'false');
  popLayer(closeBookPicker);
}

bookCatBtn.onclick = openBookPicker;
bookPickerList.addEventListener('click', e => {
  const ren = e.target.closest('[data-ren]');
  if (ren) { renderBookPicker(false, ren.dataset.ren); bindRenameInput(ren.dataset.ren); return; }

  const del = e.target.closest('[data-del]');
  if (del) { deleteBookCategory(del.dataset.del); return; }

  const ok = e.target.closest('[data-reok]');
  if (ok) { confirmRenameCategory(ok.dataset.reok); return; }

  if (e.target.closest('[data-rcancel]')) { renderBookPicker(false); return; }

  const b = e.target.closest('[data-bookcat]');
  if (!b) return;
  pickBookCategory(b.dataset.bookcat);
});

/** 改名输入框：自动聚焦全选，回车确认、Esc 取消 */
function bindRenameInput(originName) {
  const inp = $('#bookRenameInput');
  if (!inp) return;
  inp.focus();
  inp.select();
  inp.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); confirmRenameCategory(originName); }
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); renderBookPicker(false); }
  };
}

/** 改名：同步改所有笔记的 category、notebookCategories 与筛选值 */
function confirmRenameCategory(originName) {
  const inp = $('#bookRenameInput');
  const name = String(inp ? inp.value : '').trim();
  if (!name) { showSnack('分类名不能为空'); if (inp) inp.focus(); return; }
  if (name === BOOK_CAT_ALL) { showSnack('这个分类名不可用'); return; }
  if (name.length > 20) { showSnack('分类名最多 20 个字'); return; }
  if (name === originName) { renderBookPicker(false); return; }
  if (STATE.notebookCategories.includes(name) || name === BOOK_CAT_NONE) {
    showSnack('已存在同名分类');
    return;
  }
  STATE.notebookCategories = STATE.notebookCategories.map(c => (c === originName ? name : c));
  STATE.items.forEach(it => {
    if (it.kind === 'notebook' && categoryOf(it) === originName) it.category = name;
  });
  if (bookDraft.item && categoryOf(bookDraft.item) === originName) bookDraft.item.category = name;
  if (STATE.bookFilter === originName) STATE.bookFilter = name;
  renderBookChip();
  flushBook();
  renderBookPicker(false);
  if (!$('#rulesScreen').hidden) renderRules();
  showSnack('分类已改名为「' + name + '」');
}

/** 删除分类：该类笔记回到「未分类」，二次确认里写清楚影响条数 */
function deleteBookCategory(name) {
  if (name === BOOK_CAT_NONE) return;
  const affected = STATE.items.filter(it => it.kind === 'notebook' && categoryOf(it) === name).length;
  confirmDialog({
    title: '删除分类「' + name + '」？',
    text: affected
      ? '该分类下的 ' + affected + ' 条笔记会移到「未分类」，笔记内容不受影响。'
      : '这个分类下还没有笔记，删除后不可恢复。',
    okText: '删除分类',
    onOk: () => {
      STATE.notebookCategories = STATE.notebookCategories.filter(c => c !== name);
      STATE.items.forEach(it => {
        if (it.kind === 'notebook' && categoryOf(it) === name) it.category = BOOK_CAT_NONE;
      });
      if (bookDraft.item && categoryOf(bookDraft.item) === name) bookDraft.item.category = BOOK_CAT_NONE;
      if (STATE.bookFilter === name) STATE.bookFilter = BOOK_CAT_ALL;
      renderBookChip();
      flushBook();
      renderBookPicker(false);
      if (!$('#rulesScreen').hidden) renderRules();
      showSnack('已删除分类「' + name + '」');
    },
  });
}

/** 选中分类：立即生效，chip 文字更新，草稿落盘 */
function pickBookCategory(name) {
  if (!bookDraft.item) return;
  bookDraft.item.category = name || BOOK_CAT_NONE;
  registerCategory(bookDraft.item.category);
  renderBookChip();
  flushBook();
  closeBookPicker();
  if (!$('#rulesScreen').hidden) renderRules();
}

/** 新建分类：登记后自动选中 */
function createBookCategory(raw) {
  const name = String(raw || '').trim();
  if (!name) { showSnack('分类名不能为空'); $('#bookNewCatInput')?.focus(); return; }
  if (name === BOOK_CAT_ALL) { showSnack('这个分类名不可用'); return; }
  if (name.length > 20) { showSnack('分类名最多 20 个字'); return; }
  registerCategory(name);
  pickBookCategory(name);
  showSnack('已新建分类「' + name + '」');
}
