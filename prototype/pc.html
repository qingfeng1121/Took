<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-size="md">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Took · 周期打卡日历</title>
<style>
/* ============================================================================
   1. 设计令牌（PC / Android 两端逐字一致，不要在本文件里发明新色值）
   ========================================================================= */
:root{
  --bg:          #eef0f4;
  --surface:     #ffffff;
  --line:        #f0f2f5;
  --text:        #1f2329;
  --text-2:      #8a9099;
  --text-3:      #ced3da;
  --today:       #e53935;
  --accent:      #f97316;
  --accent-weak: #fff4ec;
  --accent-line: #fbbf94;
  --accent-text: #d9600f;
  --radius:      18px;

  /* 令牌的派生值：只做层次，不引入新色系 */
  --surface-2:   #f6f7f9;
  --border:      #e8ebef;
  --danger:      #c93a3a;
  --danger-weak: #fdf3f3;
  --danger-line: #f0c9c9;
  --shadow:      0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06);
  --shadow-lg:   0 24px 64px rgba(16,24,40,.18);
  --ease:        cubic-bezier(.2,.8,.2,1);

  /* 字号档位（外观 → 字号） */
  --fs-ui:   13.5px;
  --fs-tag:  12px;
  --fs-day:  13px;
}

/* 深色主题：占位实现，仅覆盖令牌，组件样式无需重写 */
[data-theme="dark"]{
  --bg:#15171c; --surface:#1c1f25; --surface-2:#23272e;
  --line:#2a2f36; --border:#343a43;
  --text:#e8eaee; --text-2:#98a0ab; --text-3:#5b636e;
  --accent-weak:#2c1d11; --accent-line:#8a4a1c; --accent-text:#ffa25c;
  --danger:#ef7d7d; --danger-weak:#2c1517; --danger-line:#5a2b2b;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.28);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
}
[data-size="sm"]{ --fs-ui:12.5px; --fs-tag:11px;   --fs-day:12px; }
[data-size="lg"]{ --fs-ui:15px;   --fs-tag:13px;   --fs-day:14px; }

/* ============================================================================
   2. 基础重置
   ========================================================================= */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .2s, color .2s;
}
button{ font-family:inherit; color:inherit; }
button:focus-visible,[tabindex]:focus-visible,.inp:focus-visible{
  outline:2px solid var(--accent-line); outline-offset:2px;
}
::selection{ background:var(--accent-line); color:#fff; }

/* ============================================================================
   3. 顶部工具条（64px）
   ========================================================================= */
.topbar{
  flex:none; height:64px; display:flex; align-items:center; gap:18px; padding:0 20px;
  background:var(--surface); border-bottom:1px solid var(--line);
  position:relative; z-index:30;
}
.brand{ display:flex; align-items:baseline; gap:7px; font-size:18px; font-weight:700; letter-spacing:-.4px; }
.brand i{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; margin-bottom:3px; }
.brand span{ font-size:11.5px; font-weight:400; color:var(--text-2); letter-spacing:0; }
.pin-group{ display:flex; align-items:center; gap:10px; min-width:0; }
.seg{ display:flex; gap:2px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; }
.seg button{
  border:0; background:transparent; cursor:pointer; font-size:12.5px; color:var(--text-2);
  padding:6px 14px; border-radius:999px; white-space:nowrap;
  transition:background .16s, color .16s, box-shadow .16s;
}
.seg button:hover{ color:var(--text); }
.seg button.on{ background:var(--surface); color:var(--text); font-weight:640; box-shadow:0 1px 2px rgba(16,24,40,.10); }
.pin-hint{ font-size:11.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .sp{ flex:1; }
.tool{
  display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px;
  border:1px solid var(--border); border-radius:10px; background:var(--surface);
  color:var(--text-2); font-size:12.5px; cursor:pointer; transition:.16s;
}
.tool:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.tool.icon{ width:34px; padding:0; justify-content:center; }
.tool svg{ width:16px; height:16px; }

/* ============================================================================
   4. 内容区 / 月历卡片
   ========================================================================= */
.stage{ flex:1; min-height:0; padding:12px 24px 14px; display:flex; justify-content:center; }
.cal{
  width:100%; max-width:1180px; min-height:0;
  display:flex; flex-direction:column; gap:8px;
  background:var(--surface); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 20px 10px;
}
.cal-head{ flex:none; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.cal-head h1{ font-size:20px; font-weight:680; letter-spacing:-.3px; }
.cal-head p{ margin-top:5px; font-size:12.5px; color:var(--text-2); }
.cal-nav{ display:flex; align-items:center; gap:8px; }
.nav-btn{
  width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--border); border-radius:10px; background:var(--surface);
  color:var(--text-2); transition:.16s;
}
.nav-btn:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.nav-btn svg{ width:15px; height:15px; }
.pill-btn{
  height:34px; padding:0 14px; cursor:pointer; font-size:12.5px;
  border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text-2);
  transition:.16s;
}
.pill-btn:hover{ border-color:var(--accent-line); color:var(--accent-text); }

.week-head{ flex:none; display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.week-head div{ text-align:center; font-size:12px; font-weight:600; color:var(--text-2); }

.grid{ flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:7px; }
.cell{
  position:relative; min-height:0; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; padding:4px 6px 3px;
  border:1px solid var(--line); border-radius:12px; background:var(--surface);
  transition:border-color .16s, background .16s;
}
.cell:hover{ border-color:var(--accent-line); background:var(--accent-weak); }
.cell.mute{ background:transparent; border-color:transparent; }
.cell.mute:hover{ background:var(--surface-2); border-color:var(--line); }
.dnum{
  flex:none; width:22px; height:22px; display:grid; place-items:center;
  font-size:var(--fs-day); font-weight:600; letter-spacing:-.2px; border-radius:999px;
}
.cell.mute .dnum{ color:var(--text-3); }
.dnum.today{ background:var(--today); color:#fff; font-weight:680; }

/* 任务标签：纯预览，不绑定单独行为（点击穿透到格子） */
/* 标签与圆点保持纯预览语义：光标是默认箭头，点了不打开面板（见 renderGrid 的点击过滤） */
.tags{ display:flex; flex-direction:column; gap:2px; min-height:0; overflow:hidden; cursor:default; }
.tag{
  display:flex; align-items:center; gap:4px; flex:none;
  align-self:flex-start; max-width:100%;
  height:16px; padding:0 7px; border-radius:6px;
  font-size:var(--fs-tag); line-height:1;
  background:var(--surface-2); color:var(--text-2);
  white-space:nowrap; overflow:hidden; font-weight:500;
}
.tag .nm{ line-height:1; min-width:0; }
.tag .nm{ display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* ============================================================================
   窗口外壳：整体透明度 / 吸附边缘 / 收起成小三角
   ========================================================================= */
#appShell{
  flex:1; min-height:0; display:flex; flex-direction:column;
  opacity: 1;
  transition: opacity .18s var(--ease), transform .26s var(--ease);
}
#appShell[hidden]{ display:none; }

/* 透明度滑块 */
.opacity-row{ display:flex; align-items:center; gap:12px; }
.opacity-range{
  flex:1; min-width:0; height:4px; appearance:none; -webkit-appearance:none;
  background:linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--p,100%), #e7ebf0 var(--p,100%));
  border-radius:999px; outline:none; cursor:pointer;
}
.opacity-range::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:#fff; border:2px solid var(--accent); box-shadow:0 1px 4px rgba(16,24,40,.18); cursor:pointer;
}
.opacity-range::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%;
  background:#fff; border:2px solid var(--accent); box-shadow:0 1px 4px rgba(16,24,40,.18); cursor:pointer;
}
.opacity-val{
  flex:none; min-width:44px; text-align:right; font-size:12.5px; color:var(--text-2);
  font-variant-numeric:tabular-nums;
}

/* 收起后只留的小三角：贴在被吸附的那条边上，悬停变主色 */
.snap-handle{
  position: fixed; z-index: 46; display: grid; place-items: center;
  width: 26px; height: 48px; padding: 0; cursor: pointer;
  background: var(--surface); color: var(--accent-text);
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(16,24,40,.14);
  transition: background .15s, transform .15s, box-shadow .15s;
}
.snap-handle[hidden]{ display:none; }
.snap-handle:hover{ background: var(--accent-weak); box-shadow: 0 8px 24px rgba(249,115,22,.24); }
.snap-handle svg{ width: 11px; height: 20px; }
.snap-handle[data-edge="left"]{ left: 0; top: 50%; transform: translateY(-50%); border-left: 0; border-radius: 0 10px 10px 0; }
.snap-handle[data-edge="right"]{ right: 0; top: 50%; transform: translateY(-50%); border-right: 0; border-radius: 10px 0 0 10px; }
.snap-handle[data-edge="right"] svg{ transform: scaleX(-1); }
.snap-handle[data-edge="top"]{ top: 0; left: 50%; transform: translateX(-50%); width: 48px; height: 26px; border-top: 0; border-radius: 0 0 10px 10px; }
.snap-handle[data-edge="top"] svg{ transform: rotate(-90deg); }
.snap-handle[data-edge="bottom"]{ bottom: 0; left: 50%; transform: translateX(-50%); width: 48px; height: 26px; border-bottom: 0; border-radius: 10px 10px 0 0; }
.snap-handle[data-edge="bottom"] svg{ transform: rotate(90deg); }
.snap-handle:hover{ transform: translateY(-50%) scale(1.06); }
.snap-handle[data-edge="top"]:hover,
.snap-handle[data-edge="bottom"]:hover{ transform: translateX(-50%) scale(1.06); }

/* 吸附到某条边：贴边留 0 间隙，并把圆角压平（像被吸住） */
#appShell[data-snap="left"]{ border-radius: 0 14px 14px 0; }
#appShell[data-snap="right"]{ border-radius: 14px 0 0 14px; }
#appShell[data-snap="top"]{ border-radius: 0 0 14px 14px; }
#appShell[data-snap="bottom"]{ border-radius: 14px 14px 0 0; }

/* 透明背景：让壁纸/桌面透上来；内容卡片自己仍保持不透明 */
body[data-transparent="on"]{ background: transparent; }
body[data-transparent="on"] #appShell{ background: transparent; }

.tag .dot{ width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.5; flex:none; }
.tag svg{ width:9px; height:9px; flex:none; }
/* 宽松档：只把标签行高压紧，换来一格多显示一条，避免被裁切 */
[data-density="loose"] .tags{ gap:2px; }
[data-density="loose"] .tag{ padding:2px 6px; }

/* 紧凑档：1 条任务名 + N + 一排更小的圆点，圆点不抢任务名的高度 */
[data-density="compact"] .dots{ gap:2px; padding-top:0; }
[data-density="compact"] .dots i{ width:4px; height:4px; }

/* 已完成：主色 + 粗字重，绝不划掉 / 变浅 / 隐藏 */
.tag.done{ background:var(--accent-weak); color:var(--accent-text); font-weight:640; }
.tag.note{ background:var(--line); color:var(--text-2); }
.tag.more{ background:transparent; color:var(--text-3); padding:0 2px; font-weight:600; }
.dots{
  display:flex; align-items:center; gap:3px; flex-wrap:nowrap; overflow:hidden;
  padding-top:1px; cursor:default; flex:none;
}
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--text-3); display:block; flex:none; }
.dots i.done{ background:var(--accent); }
.dots i.note{ background:var(--text-3); opacity:.5; }
.dots span{ font-size:10.5px; color:var(--text-3); line-height:1; }

.legend{
  flex:none; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding-top:6px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--text-2);
}
.legend b{ display:inline-flex; align-items:center; gap:6px; font-weight:400; }
.legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
.legend .l-done{ background:var(--accent-weak); box-shadow:inset 0 0 0 1px var(--accent-line); }
.legend .l-todo{ background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--border); }
.legend .l-note{ background:var(--line); }
.legend .l-today{ background:var(--today); border-radius:50%; }
.legend .tip{ margin-left:auto; color:var(--text-3); }



/* ============================================================================
   5. 通用控件：按钮 / 开关 / 输入 / 分段 / 徽章
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:36px; padding:0 16px; cursor:pointer; font-size:13px; font-weight:560;
  border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text);
  transition:background .16s, border-color .16s, color .16s, box-shadow .16s;
}
.btn:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:640; box-shadow:0 6px 16px rgba(249,115,22,.24); }
.btn.primary:hover{ background:#ea6a0d; border-color:#ea6a0d; color:#fff; }
.btn.danger{ color:var(--danger); border-color:var(--danger-line); background:var(--danger-weak); }
.btn.danger:hover{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn.ghost{ border-color:transparent; background:transparent; color:var(--text-2); }
.btn.ghost:hover{ background:var(--surface-2); color:var(--text); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; }

.switch{
  position:relative; flex:none; width:40px; height:23px; padding:0; cursor:pointer;
  border:0; border-radius:999px; background:var(--text-3); transition:background .18s;
}
.switch::after{
  content:''; position:absolute; top:2.5px; left:2.5px; width:18px; height:18px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.28);
  transition:transform .18s var(--ease);
}
.switch[aria-checked="true"]{ background:var(--accent); }
.switch[aria-checked="true"]::after{ transform:translateX(17px); }

.inp{
  height:36px; width:100%; padding:0 12px; font-family:inherit; font-size:13px; color:var(--text);
  background:var(--surface); border:1px solid var(--border); border-radius:10px; outline:none;
  transition:border-color .16s, box-shadow .16s;
}
.inp:focus{ border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-weak); }
.inp::placeholder{ color:var(--text-3); }
select.inp{ cursor:pointer; }
/* 多行正文（笔记本）：可滚动，最低 120px，竖向可拖高 */
.inp.ta{
  height:auto; min-height:120px; padding:10px 12px; line-height:1.6;
  resize:vertical; overflow:auto; font-size:13px;
}

.segbox{ display:flex; gap:3px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; }
.segbox button{
  border:0; background:transparent; cursor:pointer; font-family:inherit;
  font-size:12.5px; color:var(--text-2); padding:6px 13px; border-radius:8px; white-space:nowrap;
  transition:background .16s, color .16s, box-shadow .16s;
}
.segbox button:hover{ color:var(--text); }
.segbox button.on{ background:var(--surface); color:var(--text); font-weight:640; box-shadow:0 1px 2px rgba(16,24,40,.10); }

.badge{
  display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px;
  font-size:11px; font-weight:600; letter-spacing:.2px; white-space:nowrap;
  background:var(--surface-2); color:var(--text-2); border:1px solid transparent;
}
.badge.task{ background:var(--accent-weak); color:var(--accent-text); border-color:var(--accent-line); }
.badge.note{ background:var(--line); color:var(--text-2); }
.badge.countdown{ background:#eef4fb; color:#4b6a8f; border-color:#dbe6f2; }
[data-theme="dark"] .badge.countdown{ background:#1e2734; color:#9db8d6; border-color:#2c3a4d; }
.badge.notebook{ background:#eef7f0; color:#41724f; border-color:#dbeadd; }
[data-theme="dark"] .badge.notebook{ background:#1c2a22; color:#93bfa4; border-color:#2a3d32; }

/* ============================================================================
   6. 全屏视图（设置 / 规则管理）
   ========================================================================= */
.screen{
  position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  background:var(--bg); animation:screenIn .2s var(--ease);
}
@keyframes screenIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.screen[hidden]{ display:none; }
.screen-head{
  flex:none; height:64px; display:flex; align-items:center; gap:12px; padding:0 20px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.screen-head h2{ font-size:16px; font-weight:680; letter-spacing:-.2px; }
.screen-head .sub{ font-size:12px; color:var(--text-2); margin-left:2px; }
.icon-btn{
  width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text-2);
  transition:.16s;
}
.icon-btn:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.icon-btn svg{ width:16px; height:16px; }
.icon-btn.on{ border-color:var(--accent-line); background:var(--accent-weak); color:var(--accent-text); }

/* 设置：左导航 + 右内容 */
.set-body{ flex:1; min-height:0; display:flex; }
.set-nav{
  flex:none; width:196px; padding:16px 12px; background:var(--surface);
  border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px; overflow:auto;
}
.set-nav button{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; cursor:pointer;
  border:0; border-radius:10px; background:transparent; color:var(--text-2);
  font-size:13px; text-align:left; transition:background .16s, color .16s;
}
.set-nav button svg{ width:15px; height:15px; flex:none; }
.set-nav button:hover{ background:var(--surface-2); color:var(--text); }
.set-nav button.on{ background:var(--accent-weak); color:var(--accent-text); font-weight:640; }
.set-main{ flex:1; min-width:0; overflow:auto; padding:22px 26px 40px; }
.set-panel{ display:none; max-width:720px; }
.set-panel.wide{ max-width:960px; }
.set-panel.on{ display:block; animation:fadeIn .18s var(--ease); }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.panel-title{ font-size:15px; font-weight:680; margin-bottom:4px; }
.panel-desc{ font-size:12.5px; color:var(--text-2); margin-bottom:16px; line-height:1.6; }
.card{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; margin-bottom:16px;
}
.row{
  display:flex; align-items:center; gap:16px; padding:14px 18px;
  border-bottom:1px solid var(--line); min-height:56px;
}
.row:last-child{ border-bottom:0; }
.row.col{ flex-direction:column; align-items:stretch; gap:10px; }
.row .k{ flex:1; min-width:0; }
.row .k b{ display:block; font-size:13.5px; font-weight:600; }
.row .k i{ display:block; margin-top:3px; font-size:11.5px; font-style:normal; color:var(--text-2); line-height:1.5; }
.row .v{ flex:none; display:flex; align-items:center; gap:8px; }
.row .v .segbox{ flex:none; }
.row .v .inp{ width:240px; }
.stat-line{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2); }
.stat-line .dot-ok{ width:7px; height:7px; border-radius:50%; background:#38a169; }
.stat-line .dot-off{ width:7px; height:7px; border-radius:50%; background:var(--text-3); }
.conflict{
  margin:0 18px 14px; padding:11px 13px; border-radius:10px; font-size:12px; line-height:1.6;
  background:var(--accent-weak); border:1px solid var(--accent-line); color:var(--accent-text);
}
.stat-note{ padding:14px 18px; font-size:12px; color:var(--text-2); line-height:1.7; }
.stat-note code{ font-size:11.5px; background:var(--surface-2); padding:1px 5px; border-radius:5px; color:var(--accent-text); }
.win-preview{
  display:grid; place-items:center; padding:20px; background:var(--surface-2);
  border-radius:14px; border:1px dashed var(--border); margin:14px 18px;
}
.win-preview .frame{
  background:linear-gradient(160deg,#3b4a5f,#1f2329); border-radius:10px;
  padding:6px; box-shadow:0 10px 24px rgba(16,24,40,.28); transition:.25s var(--ease);
}
.win-preview .inner{
  background:var(--surface); border-radius:6px; width:100%; height:100%;
  display:grid; place-items:center; color:var(--text-3); font-size:10px; letter-spacing:.5px;
}
.about-line{ display:flex; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); font-size:13px; }
.about-line:last-child{ border-bottom:0; }
.about-line b{ flex:none; width:96px; font-weight:600; color:var(--text-2); font-size:12.5px; }

/* ============================================================================
   7. 规则管理
   ========================================================================= */
/* 规则面板（嵌在设置右侧内容区里，滚动共用 .set-main）
   .rules-wrap 底部留 110px：展开任务后行数变多，也要让右下角 FAB 压不到最后一行 */
#rulesPanel[hidden]{ display:none; }
.rules-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.rules-head-text{ min-width:0; }
.rules-head-text .panel-desc{ margin-bottom:0; }
.rules-wrap{ max-width:940px; display:flex; flex-direction:column; gap:14px; padding-bottom:110px; }
/* 规则之间 14px（#rulesList），规则行与其展开的任务区之间 8px（.rule-block） */
#rulesList{ display:flex; flex-direction:column; gap:14px; }
.rule-block{ display:flex; flex-direction:column; gap:8px; }
.rules-tip{
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); padding:2px 2px 6px;
}
.rule-row{
  display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer;
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
  border:1px solid transparent; transition:border-color .16s, transform .16s, box-shadow .16s;
}
.rule-row:hover{ border-color:var(--accent-line); }
.rule-row.sel{ border-color:var(--accent); background:var(--accent-weak); }
.rule-row.off{ background:var(--surface-2); box-shadow:none; border-color:var(--border); }
.rule-row.off .rule-name b{ color:var(--text-2); }
.rule-row .circle{
  flex:none; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--text-3);
  display:none; place-items:center; background:var(--surface); transition:.16s;
}
/* 选择态下所有分类都要露出勾选圈：之前用 :not([data-flat]) 把记事/倒数日/笔记全排除了 */
#rulesPanel.selecting .rule-row .circle{ display:grid; animation:fadeIn .16s var(--ease); }
/* 三缸按钮触发的圆形操作条：从右往左滑出 */
.sel-bar{
  display:flex; align-items:center; gap:8px; margin-right:2px;
  max-width:0; opacity:0; overflow:hidden; transform:translateX(18px);
  transition:max-width .26s var(--ease), opacity .2s var(--ease), transform .26s var(--ease);
}
.sel-bar.on{ max-width:320px; opacity:1; transform:none; }
.sel-circle{
  flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--text-2); transition:.16s;
}
.sel-circle:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.sel-circle.danger:hover{ border-color:var(--danger-line); background:var(--danger-weak); color:var(--danger); }
.sel-circle svg{ width:15px; height:15px; }
.sel-bar .count{ font-size:12px; color:var(--text-2); white-space:nowrap; padding:0 2px; }
.rule-row.sel .circle{ background:var(--accent); border-color:var(--accent); color:#fff; }
.rule-row .circle svg{ width:12px; height:12px; opacity:0; }
.rule-row.sel .circle svg{ opacity:1; }
.rule-main{ flex:1; min-width:0; }
.rule-name{ display:flex; align-items:center; gap:8px; min-width:0; max-width:100%; }
.rule-name > .badge{ flex:none; }
/* 标题必须是可收缩的 flex 项，否则长名字会把整行撑破（min-width:auto 的默认行为） */
.rule-name b{ min-width:0; font-size:14px; font-weight:640; letter-spacing:-.1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rule-name .off-tag{ flex:none; font-size:11px; color:var(--text-3); }
.rule-sum{ display:block; min-width:0; margin-top:6px; font-size:12px; color:var(--text-2); line-height:1.5;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rule-side{ flex:none; display:flex; align-items:center; gap:14px; }
.rate{ text-align:right; font-size:11.5px; color:var(--text-2); line-height:1.4; }
.rate b{ display:block; font-size:13px; font-weight:660; color:var(--accent-text); }
.rate.zero b{ color:var(--text-3); }
.fab{
  position:fixed; right:34px; bottom:34px; z-index:45;
  width:56px; height:56px; border-radius:50%; cursor:pointer; border:0;
  display:grid; place-items:center; color:#fff;
  background:var(--accent); box-shadow:0 10px 26px rgba(249,115,22,.40);
  transition:transform .18s var(--ease), background .18s, box-shadow .18s;
}
.fab[hidden]{ display:none; }
.fab:hover{ transform:translateY(-2px) scale(1.03); }
.fab:active{ transform:scale(.96); }
.fab svg{ width:24px; height:24px; }
.fab.del{ background:var(--today); box-shadow:0 10px 26px rgba(229,57,53,.38); }
.fab.del:hover{ background:#cf3230; }
.fab .cnt{
  position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px;
  border-radius:999px; background:var(--text); color:#fff; font-size:11px; font-weight:640;
  display:grid; place-items:center; border:2px solid var(--surface);
}
.rule-empty{ padding:48px 0; text-align:center; font-size:13px; color:var(--text-2); }

/* ============================================================================
   7.5 笔记本（列表 → 全屏书写）：分类筛选条 / 行内分类 chip / 全屏编辑器
       —— 编辑器是「整页白底」不是卡片，全部复用既有令牌，不新增色值
   ========================================================================= */
body.book-open{ overflow:hidden; }

/* 列表顶部：全部 · 未分类 · 各分类 */
.book-filters{ display:flex; flex-wrap:wrap; gap:8px; padding:0 0 2px; }
.book-filter{
  height:28px; padding:0 12px; cursor:pointer; font-family:inherit; font-size:12.5px;
  color:var(--text-2); background:var(--surface); border:1px solid var(--border);
  border-radius:999px; transition:.14s;
}
.book-filter:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.book-filter.on{ background:var(--accent-weak); border-color:var(--accent-line); color:var(--accent-text); font-weight:640; }

/* 行内分类 chip：放在摘要上一行 */
.book-tag{
  display:inline-flex; align-items:center; gap:4px; height:19px; margin-top:6px; padding:0 7px;
  font-size:11.5px; color:var(--accent-text); background:var(--accent-weak);
  border:1px solid var(--accent-line); border-radius:6px;
}
.book-tag svg{ width:11px; height:11px; flex:none; }

/* ---- 全屏编辑器：顶栏 56px + 白底正文 ---- */
.book-screen{ background:var(--surface); animation:bookIn .18s var(--ease); }
@keyframes bookIn{ from{ opacity:0; transform:translateX(12px); } to{ opacity:1; transform:none; } }
.be-top{
  flex:none; height:56px; display:flex; align-items:center; gap:8px; padding:0 14px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.be-icon{
  flex:none; width:32px; height:32px; display:grid; place-items:center; cursor:pointer;
  border:0; border-radius:8px; background:transparent; color:var(--text-2);
  transition:background .14s, color .14s;
}
.be-icon:hover{ background:var(--surface-2); color:var(--text); }
.be-icon svg{ width:24px; height:24px; }
.be-more{ position:relative; }
.be-menu{
  position:absolute; top:38px; right:0; z-index:5; min-width:140px; padding:5px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow-lg); animation:pop .14s var(--ease);
}
.be-menu[hidden]{ display:none; }
.be-menu button{
  display:block; width:100%; padding:9px 11px; text-align:left; cursor:pointer;
  font-family:inherit; font-size:13px; color:var(--text);
  border:0; border-radius:8px; background:transparent;
}
.be-menu button:hover{ background:var(--surface-2); }

/* 分类 chip：--surface-2 底 / 8px 圆角 / 12.5px / 左侧文件夹图标 */
.be-chip{
  flex:none; display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;
  cursor:pointer; font-family:inherit; font-size:12.5px; color:var(--text-2);
  background:var(--surface-2); border:1px solid transparent; border-radius:8px; transition:.14s;
}
.be-chip:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.be-chip svg{ width:13px; height:13px; flex:none; }

.be-scroll{ flex:1; min-height:0; overflow:auto; background:var(--surface); }
.be-doc{ max-width:720px; margin:0 auto; padding:22px 28px 64px; }
/* 标题：28px / 680，无边框，占位走 --text-3 */
.be-title{
  font-size:28px; font-weight:680; line-height:1.35; letter-spacing:-.4px; color:var(--text);
  outline:none; word-break:break-word; text-align:left;
}
.be-title:empty::before{ content:attr(data-ph); color:var(--text-3); }
.be-meta{ display:flex; align-items:center; margin-top:8px; font-size:12px; color:var(--text-2); }
.be-meta-dot{ font-style:normal; color:var(--text-3); margin:0 3px; }
.be-type{ position:relative; margin-top:16px; }
/* 正文：14.5px / 行高 1.8，顶部对齐、左对齐，占满剩余高度 */
.be-body{
  display:block; width:100%; min-height:calc(100vh - 280px); resize:none; overflow:hidden;
  border:0; outline:none; padding:0; background:transparent;
  font-family:inherit; font-size:14.5px; line-height:1.8; color:var(--text); text-align:left;
}
.be-body::placeholder{ color:var(--text-3); }
/* 正文为空时的黄色小胶囊：占位提示，按钮本身禁用（不做假功能） */
.be-think{
  position:absolute; top:0; right:0; height:26px; padding:0 10px; cursor:not-allowed;
  font-family:inherit; font-size:11.5px; color:var(--accent-text);
  background:var(--accent-weak); border:1px solid var(--accent-line); border-radius:999px;
}
.be-think[hidden]{ display:none; }
.be-think:disabled{ opacity:.8; }

/* ---- 分类选择层（浮在编辑器上，不跳页） ---- */
.book-picker-mask{
  position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:24px;
  background:rgba(16,24,40,.34); backdrop-filter:blur(2px); animation:fadeIn .16s var(--ease);
}
.book-picker-mask[hidden]{ display:none; }
.book-picker{
  width:100%; max-width:360px; max-height:min(72vh,560px); display:flex; flex-direction:column;
  background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg); animation:pop .18s var(--ease);
}
.book-picker-head{
  flex:none; padding:17px 20px 12px; font-size:15px; font-weight:680; border-bottom:1px solid var(--line);
}
.book-picker-list{
  flex:1; min-height:0; overflow:auto; padding:8px; display:flex; flex-direction:column; gap:2px;
}
.book-cat{
  display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; cursor:pointer;
  font-family:inherit; font-size:13.5px; color:var(--text); text-align:left;
  border:0; border-radius:10px; background:transparent;
}
.book-cat svg{ width:14px; height:14px; flex:none; }
.book-cat .bk-ico{ display:grid; place-items:center; color:var(--text-3); }
.book-cat.on .bk-ico{ color:var(--accent-text); }
.book-cat:hover{ background:var(--surface-2); }
.book-cat.on{ background:var(--accent-weak); color:var(--accent-text); font-weight:640; }
.book-cat .bk-tick{ margin-left:auto; display:grid; place-items:center; color:var(--accent-text); }
.book-cat .bk-tick svg{ width:15px; height:15px; }
.book-picker-new{ flex:none; display:flex; gap:8px; align-items:center; padding:10px 12px 12px; border-top:1px solid var(--line); }
.book-picker-new .inp{ flex:1; min-width:0; }
.book-picker-newbtn{
  flex:1; height:38px; cursor:pointer; font-family:inherit; font-size:13px; color:var(--accent-text);
  background:var(--accent-weak); border:1px dashed var(--accent-line); border-radius:10px;
}

/* 二次确认必须盖在笔记本分类层（z-index 90）之上，否则确认框被遮住、点不到 */
#confirmMask{ z-index: 100; }

/* 分类行：左侧选择区 + 右侧重命名/删除小按钮 */
.book-cat-row{ display:flex; align-items:center; gap:4px; border-radius:10px; }
.book-cat-row > .book-cat{ flex:1; min-width:0; }
.book-cat-row .bk-act{
  flex:none; width:28px; height:28px; padding:0; display:grid; place-items:center; cursor:pointer;
  border:0; border-radius:7px; background:transparent; color:var(--text-2);
  transition:background .14s, color .14s;
}
.book-cat-row .bk-act svg{ width:14px; height:14px; }
.book-cat-row .bk-act:hover{ background:var(--surface-2); color:var(--text); }
.book-cat-row .bk-act.danger:hover{ background:var(--danger-weak, #fdecec); color:var(--danger, #e53935); }
.book-cat-row.editing{ gap:6px; padding:4px 4px 4px 0; }
.book-cat-row.editing .inp{ flex:1; min-width:0; height:34px; }
.book-cat-row.editing .bk-act.ok{
  width:auto; padding:0 12px; font-size:12.5px; color:var(--accent-text);
  background:var(--accent-weak); border:1px solid var(--accent-line);
}
.be-menu button.danger{ color:var(--danger, #e53935); }

/* 展开箭头（▸ 旋转 90° 即 ▾）与任务数徽章 */
.rule-row .caret{
  flex:none; width:24px; height:24px; padding:0; display:grid; place-items:center; cursor:pointer;
  border:0; background:transparent; color:var(--text-2); border-radius:7px;
  transition:transform .18s var(--ease), background .14s, color .14s;
}
.rule-row .caret svg{ width:15px; height:15px; }
.rule-row .caret.on{ transform:rotate(90deg); color:var(--accent-text); }
.rule-row .caret:hover{ background:var(--surface-2); color:var(--text); }
/* 非规则行（记事 / 倒数日 / 笔记本）没有展开箭头，也不必预留箭头的位置：
   标题直接贴着行的内边距起排，左边不再空出一大块。规则行的箭头完全不受影响。 */
.rule-row[data-flat="1"] .rule-main{ margin-left:0; }
.rule-main[role="button"]{ cursor:pointer; }
.task-count{
  font-size:11.5px; color:var(--text-2); white-space:nowrap;
  padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line);
}

/* 规则行下方原地展开的任务区 */
.task-panel{
  display:flex; flex-direction:column; gap:2px; padding:10px 12px 12px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
  box-shadow:inset 0 1px 2px rgba(16,24,40,.03);
}
.task-item{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; transition:background .14s; }
.task-item:hover{ background:var(--surface); box-shadow:0 1px 2px rgba(16,24,40,.05); }
.task-name{
  flex:1; min-width:0; padding:4px 0; text-align:left; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:560; color:var(--text); background:transparent; border:0; border-radius:6px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.task-name:hover{ color:var(--accent-text); }
.task-item.off .task-name{ color:var(--text-3); }
.switch.sm{ width:34px; height:20px; }
.switch.sm::after{ top:2.5px; left:2.5px; width:15px; height:15px; }
.switch.sm[aria-checked="true"]::after{ transform:translateX(14px); }
.task-del{
  flex:none; width:28px; height:28px; padding:0; display:grid; place-items:center; cursor:pointer;
  border:0; border-radius:7px; background:var(--surface); color:var(--text-2);
  box-shadow:inset 0 0 0 1px var(--border); transition:.14s;
}
.task-del:hover{ background:var(--danger-weak); color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger-line); }
.task-del svg{ width:14px; height:14px; }
.task-add{
  align-self:flex-start; margin:2px 0 2px 4px; height:30px; padding:0 11px; cursor:pointer; font-family:inherit;
  font-size:12.5px; color:var(--accent-text); background:transparent;
  border:1px dashed var(--accent-line); border-radius:9px; transition:.14s;
}
.task-add:hover{ background:var(--accent-weak); }
.task-empty{ padding:10px 8px 6px; font-size:12px; color:var(--text-2); }

/* ============================================================================
   8. 当天打卡面板
   ========================================================================= */
.mask{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px;
  background:rgba(16,24,40,.34); backdrop-filter:blur(2px);
  animation:fadeIn .16s var(--ease);
}
.mask[hidden]{ display:none; }
.sheet{
  width:100%; max-width:430px; max-height:min(86vh,720px); display:flex; flex-direction:column;
  background:var(--surface); border-radius:22px; box-shadow:var(--shadow-lg);
  animation:pop .2s var(--ease);
}
@keyframes pop{ from{ opacity:0; transform:translateY(10px) scale(.985); } to{ opacity:1; transform:none; } }
.sheet-head{ flex:none; position:relative; padding:20px 22px 15px; border-bottom:1px solid var(--line); }
.sheet-head h3{ font-size:17px; font-weight:680; letter-spacing:-.2px; }
.sheet-head p{ margin-top:5px; font-size:12.5px; color:var(--text-2); }
.sheet-head .today-dot{ color:var(--today); font-weight:640; }
.sheet-close{
  position:absolute; top:16px; right:16px; width:30px; height:30px; display:grid; place-items:center;
  cursor:pointer; border:0; border-radius:50%; background:var(--surface-2); color:var(--text-2);
  transition:.16s;
}
.sheet-close:hover{ background:var(--line); color:var(--text); }
.sheet-close svg{ width:13px; height:13px; }
.sheet-list{ flex:1; min-height:0; overflow:auto; padding:10px 12px; }
/* 打卡面板按规则分组：组标题 + 组内任务行 */
.sgroup{ padding:4px 0 6px; }
.sgroup + .sgroup{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
.sgroup-head{ display:flex; align-items:baseline; gap:8px; padding:6px 10px 4px; min-width:0; }
.sgroup-head b{ flex:none; font-size:12.5px; font-weight:660; color:var(--text); letter-spacing:-.1px; }
.sgroup-sum{
  flex:1; min-width:0; font-size:11px; color:var(--text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.note-group .sgroup-head b{ color:var(--text-2); }
.mtask{
  display:flex; align-items:center; gap:12px; width:100%; padding:11px 10px; cursor:pointer;
  font-family:inherit;
  border:0; border-radius:12px; background:transparent; text-align:left;
  transition:background .14s;
}
.mtask:hover{ background:var(--surface-2); }
.tick{
  flex:none; width:23px; height:23px; border-radius:50%; border:1.7px solid var(--text-3);
  display:grid; place-items:center; color:#fff; transition:.16s;
}
.tick svg{ width:12px; height:12px; opacity:0; transition:opacity .14s; }
.mtask.done .tick{ background:var(--accent); border-color:var(--accent); }
.mtask.done .tick svg{ opacity:1; }
.mtask-name{ flex:1; min-width:0; font-size:13.5px; font-weight:560;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mtask.done .mtask-name{ color:var(--accent-text); font-weight:660; }
.mtask-state{ flex:none; font-size:11.5px; color:var(--text-3); }
.mtask.done .mtask-state{ color:var(--accent-text); font-weight:600; }
.mnote{
  display:flex; align-items:flex-start; gap:12px; padding:11px 10px; border-radius:12px;
}
.mnote .tick{ border-radius:6px; border-style:dashed; }
.mnote .mtask-name{ display:block; font-weight:500; color:var(--text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mnote .txt{ margin-top:3px; font-size:11.5px; color:var(--text-3); line-height:1.5;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mempty{ padding:34px 0; text-align:center; font-size:12.5px; color:var(--text-2); }
.sheet-foot{
  flex:none; display:flex; align-items:center; gap:10px; padding:13px 16px 16px;
  border-top:1px solid var(--line);
}
.sheet-foot .grow{ flex:1; }

/* ============================================================================
   9. 完成提示卡 / 轻提示 / 确认弹层 / 烟花画布
   ========================================================================= */
#fx{ position:fixed; inset:0; z-index:90; pointer-events:none; width:100%; height:100%; }
.done-toast{
  position:fixed; top:88px; left:50%; z-index:95; pointer-events:none;
  display:flex; align-items:center; gap:13px; padding:13px 20px 13px 14px;
  background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg);
  border:1px solid var(--line);
  transform:translate(-50%,-14px); opacity:0; transition:opacity .26s var(--ease), transform .26s var(--ease);
}
.done-toast.show{ opacity:1; transform:translate(-50%,0); }
.done-toast .ok{
  flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(249,115,22,.35);
}
.done-toast .ok svg{ width:19px; height:19px; }
.done-toast b{ display:block; font-size:13.5px; font-weight:680; letter-spacing:-.1px; }
.done-toast span{ display:block; margin-top:3px; font-size:11.5px; color:var(--text-2); }

.snack{
  position:fixed; left:50%; bottom:32px; z-index:88; pointer-events:none;
  padding:10px 18px; border-radius:999px; font-size:12.5px;
  background:rgba(31,35,41,.92); color:#fff; box-shadow:var(--shadow);
  transform:translate(-50%,12px); opacity:0; transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.snack.show{ opacity:1; transform:translate(-50%,0); }

.dialog{
  width:100%; max-width:580px; max-height:88vh; display:flex; flex-direction:column;
  background:var(--surface); border-radius:20px; box-shadow:var(--shadow-lg);
  animation:pop .2s var(--ease);
}
.dialog-head{ flex:none; padding:18px 22px 14px; border-bottom:1px solid var(--line); }
.dialog-head h3{ min-width:0; font-size:16px; font-weight:680;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dialog-head p{ margin-top:4px; font-size:12px; color:var(--text-2); }
.dialog-body{ flex:1; min-height:0; overflow:auto; padding:16px 22px; }
.dialog-foot{
  flex:none; display:flex; align-items:center; gap:10px; padding:13px 22px 17px;
  border-top:1px solid var(--line);
}
.frow{ display:flex; align-items:flex-start; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); }
.frow:last-child{ border-bottom:0; }
.frow > label,.frow > .lb{ flex:none; width:88px; padding-top:9px; font-size:12.5px; color:var(--text-2); }
.frow .fc{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{
  height:30px; padding:0 12px; cursor:pointer; font-size:12.5px; font-family:inherit;
  border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text-2);
  transition:.14s;
}
.chip:hover{ border-color:var(--accent-line); color:var(--accent-text); }
.chip.on{ background:var(--accent-weak); border-color:var(--accent-line); color:var(--accent-text); font-weight:640; }
.hint{ font-size:11.5px; color:var(--text-3); line-height:1.5; }
.pair{ display:flex; align-items:center; gap:8px; }
.pair .inp{ width:auto; flex:1; }
.pair span{ font-size:12px; color:var(--text-3); }
.inp[disabled]{ opacity:.5; cursor:not-allowed; background:var(--surface-2); }
/* 5 项的分段器会超出弹窗宽度：允许换行成两行 */
.segbox.segwrap{ flex-wrap:wrap; }
.segwrap button{ flex:1 1 auto; padding:6px 10px; }
/* 单行「说明 + 开关」：与 .pair 区分，开关贴右 */
.frow-inline{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.confirm-card{
  width:100%; max-width:360px; padding:24px 24px 18px; background:var(--surface);
  border-radius:20px; box-shadow:var(--shadow-lg); text-align:center; animation:pop .18s var(--ease);
}
.confirm-card .warn{
  width:42px; height:42px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center;
  background:var(--danger-weak); color:var(--danger);
}
.confirm-card .warn svg{ width:20px; height:20px; }
.confirm-card h4{ font-size:15px; font-weight:680; }
.confirm-card p{ margin-top:7px; font-size:12.5px; color:var(--text-2); line-height:1.6; }
.confirm-card .acts{ display:flex; gap:10px; margin-top:18px; }
.confirm-card .acts .btn{ flex:1; }

/* ============================================================================
   6.5 统计分析（覆盖层）：区间 / KPI / 图表 / 明细表
       —— 视觉沿用样例 analysis-sample.html，只复用本文件的令牌与类
   ========================================================================= */
#analysisScreen .screen-head .sub{
  flex:1; min-width:0; margin-left:2px; font-size:12px; color:var(--text-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.an-tools{ flex:none; display:flex; align-items:center; gap:10px; min-width:0; }
.an-seg button{ padding:6px 12px; }
.an-dd{ position:relative; }
.an-dd-btn .an-dd-k{ color:var(--text-2); }
.an-dd-btn b{ font-weight:640; color:var(--text); }
.an-chev{ width:13px; height:13px; transition:transform .18s var(--ease); }
.an-dd.open .an-chev{ transform:rotate(180deg); }
.an-dd.open .an-dd-btn{ border-color:var(--accent-line); }
.an-dd.open .an-dd-btn b{ color:var(--accent-text); }
.an-dd-panel{
  position:absolute; right:0; top:calc(100% + 8px); min-width:164px; padding:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow-lg); z-index:5;
}
.an-dd-panel[hidden]{ display:none; }
.an-dd-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:8px 10px; border:0; background:transparent; border-radius:9px; cursor:pointer;
  font-family:inherit; font-size:12.5px; color:var(--text-2); text-align:left; transition:.14s;
}
.an-dd-item:hover{ background:var(--surface-2); color:var(--text); }
.an-dd-item.on{ background:var(--accent-weak); color:var(--accent-text); font-weight:640; }
.an-dd-item svg{ flex:none; width:13px; height:13px; opacity:0; }
.an-dd-item.on svg{ opacity:1; }

.an-stage{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:18px 24px 26px; }
.an-wrap{ max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

.an-meta{ display:flex; align-items:center; gap:9px; min-width:0; font-size:11.5px; color:var(--text-2); }
.an-meta b{ color:var(--text); font-weight:640; font-variant-numeric:tabular-nums; }
.an-meta .dot{ flex:none; width:3px; height:3px; border-radius:50%; background:var(--text-3); }
.an-meta span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.an-kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.an-kpi{
  min-width:0; background:var(--surface); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:15px 17px 14px;
}
.an-kpi-label{ font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.an-kpi-num{ margin-top:9px; display:flex; align-items:baseline; gap:4px; }
.an-kpi-num b{
  font-size:30px; font-weight:700; letter-spacing:-1.2px; line-height:1;
  font-variant-numeric:tabular-nums;
}
.an-kpi-num span{ font-size:12px; color:var(--text-2); }
.an-kpi-sub{ margin-top:8px; font-size:11.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.an-kpi-delta{
  margin-top:5px; display:flex; align-items:center; gap:4px; font-size:11.5px;
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.an-kpi-delta .arw{ font-size:9px; }
.an-kpi-delta.up{ color:var(--accent-text); }
.an-kpi-delta.down{ color:var(--danger); }
.an-kpi-delta.flat{ color:var(--text-3); }

.an-charts{ display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr); gap:16px; }
.an-card{ margin-bottom:0; padding:16px 18px 14px; overflow:visible; }
.an-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.an-card-head h3{ font-size:13.5px; font-weight:680; letter-spacing:-.1px; }
.an-card-head p{ margin-top:4px; font-size:11.5px; color:var(--text-2); }
.an-legend{ flex:none; display:flex; align-items:center; gap:12px; padding-top:2px; }
.an-legend span{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); white-space:nowrap; }
.an-legend i{ width:7px; height:7px; border-radius:2px; display:inline-block; }

.an-plot-wrap{ display:flex; flex-direction:column; gap:8px; padding-top:4px; }
.an-plot{
  position:relative; height:188px; display:flex; align-items:flex-end; gap:4px;
  border-bottom:1px solid var(--border);
}
.an-plot::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 25%);
}
.an-bar{ position:relative; flex:1 1 0; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; }
.an-bar .stk{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:flex-end; transition:opacity .14s; }
.an-bar .sgm{ width:100%; min-height:0; }
.an-bar .sgm.done{ background:var(--accent); }
.an-bar .sgm.miss{ background:var(--text-3); }
.an-bar .sgm.task{ background:var(--accent-line); }
.an-bar .stub{ flex:none; height:4px; border-radius:2px; background:var(--line); }
.an-bar:hover .stk{ opacity:.75; }
.an-xlabels{ display:flex; gap:4px; }
.an-xlabels span{
  flex:1 1 0; min-width:0; text-align:center; font-size:10.5px; color:var(--text-3);
  white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums;
}
.an-xmonths{ display:flex; gap:4px; margin-top:2px; }
.an-xmonths[hidden]{ display:none; }
.an-xmonths span{
  text-align:center; font-size:10px; color:var(--text-3); letter-spacing:.2px;
  border-top:1px dashed var(--line); padding-top:4px; white-space:nowrap; overflow:hidden;
}

.an-hb-list{ display:flex; flex-direction:column; gap:15px; padding:3px 0 2px; }
.an-hb{ display:flex; align-items:center; gap:10px; min-width:0; }
.an-hb-name{ flex:none; width:80px; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.an-hb-track{ flex:1 1 auto; min-width:24px; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.an-hb-track i{ display:block; height:100%; border-radius:999px; background:var(--accent-line); }
.an-hb.top .an-hb-track i{ background:linear-gradient(90deg,var(--accent-line),var(--accent)); }
.an-hb-val{ flex:none; width:56px; text-align:right; font-size:12px; font-weight:640; font-variant-numeric:tabular-nums; }
.an-card-foot{ margin-top:14px; padding-top:11px; border-top:1px solid var(--line); font-size:11px; color:var(--text-3); }

.an-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:34px 10px; text-align:center; }
.an-empty .ico{
  width:38px; height:38px; border-radius:50%; background:var(--accent-weak);
  color:var(--accent); display:grid; place-items:center; margin-bottom:2px;
}
.an-empty .ico svg{ width:18px; height:18px; }
.an-empty b{ font-size:12.5px; font-weight:640; color:var(--text); }
.an-empty span{ font-size:11.5px; color:var(--text-2); }

.an-table-card{ padding:16px 18px 6px; }
.an-tbl{ width:100%; border-collapse:collapse; table-layout:fixed; }
.an-tbl th{
  font-size:11.5px; font-weight:500; color:var(--text-2); text-align:left;
  padding:9px 8px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.an-tbl th:first-child,.an-tbl td:first-child{ padding-left:2px; }
.an-tbl th.sortable{ cursor:pointer; user-select:none; transition:color .14s; }
.an-tbl th.sortable:hover{ color:var(--text); }
.an-tbl th.active{ color:var(--text); font-weight:640; }
.an-caret{
  display:inline-block; margin-left:5px; vertical-align:middle;
  width:0; height:0; border-left:3.5px solid transparent; border-right:3.5px solid transparent;
  border-top:5px solid var(--text-3);
}
.an-tbl th.asc .an-caret{ border-top:0; border-bottom:5px solid var(--accent); }
.an-tbl th.desc .an-caret{ border-top:5px solid var(--accent); }
.an-tbl td{
  font-size:12.5px; padding:12px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;
}
.an-tbl tbody tr:last-child td{ border-bottom:0; }
.an-tbl tbody tr:hover td{ background:var(--surface-2); }
.an-tbl td.an-nopad{ padding:0; }
.an-rule-cell{ display:flex; align-items:center; gap:7px; min-width:0; }
.an-rule-cell i{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--accent-line); }
.an-rule-cell span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.an-task-cell{ display:flex; align-items:center; gap:6px; min-width:0; }
.an-task-cell em{ font-style:normal; min-width:0; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.an-rate{ display:flex; align-items:center; gap:9px; }
.an-rate-track{ flex:1 1 auto; min-width:26px; max-width:76px; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.an-rate-track i{ display:block; height:100%; border-radius:999px; background:var(--accent); }
.an-rate-track i.low{ background:var(--accent-line); }
.an-rate-track i.zero{ background:var(--text-3); }
.an-rate b{ flex:none; min-width:42px; text-align:right; font-size:12px; font-weight:640; }
.an-mut{ color:var(--text-3); }
.an-pill{
  flex:none; display:inline-flex; align-items:center; height:19px; padding:0 7px;
  border-radius:999px; background:var(--accent-weak); color:var(--accent-text);
  font-size:10.5px; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.an-pill.plain{ background:var(--surface-2); color:var(--text-2); }

@media (max-width:1140px){
  .an-stage{ padding:16px 16px 22px; }
  .an-tools{ gap:8px; }
  .an-seg button{ padding:6px 9px; font-size:12px; }
  .an-card{ padding:15px 16px 13px; }
  .an-table-card{ padding:15px 16px 6px; }
  .an-kpi{ padding:14px 15px 13px; }
  .an-kpi-num b{ font-size:27px; }
  .an-hb-name{ width:70px; }
  .an-charts{ gap:14px; }
  .an-wrap{ gap:14px; }
}

/* 打卡面板分组头右侧的「›」：只有它可以点，分组头本身不可点 */
.sgroup-add{
  flex:none; align-self:center; width:24px; height:24px; display:grid; place-items:center;
  padding:0; cursor:pointer; border:1px solid var(--border); border-radius:50%;
  background:var(--surface); color:var(--text-3); transition:.16s;
}
.sgroup-add svg{ width:11px; height:11px; }
.sgroup-add:hover{ border-color:var(--accent-line); background:var(--accent-weak); color:var(--accent-text); }

</style>
</head>


<body>


<!-- 窗口外壳：整体透明度 / 吸附边缘 / 收起成小三角都作用在这一层 -->
<div id="appShell">

<!-- ==========================================================================
     顶部工具条：产品名 · 固定方式 · 设置（规则在 设置 → 任务规则）
     ======================================================================= -->
<header class="topbar">
  <div class="brand"><i></i>Took<span>周期打卡日历</span></div>

  <div class="pin-group">
    <div class="seg" id="pinSeg" role="group" aria-label="窗口固定方式">
      <button type="button" data-pin="wallpaper">贴桌面壁纸</button>
      <button type="button" data-pin="top">置顶窗口</button>
      <button type="button" data-pin="normal">普通窗口</button>
    </div>
    <span class="pin-hint" id="pinHint"></span>
  </div>

  <div class="sp"></div>

  <button type="button" class="tool icon" id="btnAnalysis" aria-label="统计分析" title="统计分析">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20V4"/>
      <rect x="7.6" y="12.4" width="3.4" height="5.2" rx="1"/>
      <rect x="13.4" y="8.6" width="3.4" height="9" rx="1"/>
      <path d="M3.2 20h17.6"/>
    </svg>
  </button>

  <button type="button" class="tool icon" id="btnNew" aria-label="新建与管理" title="新建与管理">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <button type="button" class="tool icon" id="btnCollapse" aria-label="收起窗口" title="收起（吸附边缘后只留小三角）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13 6 7 12l6 6"/><path d="M19 6l-6 6 6 6"/>
    </svg>
  </button>

  <button type="button" class="tool icon" id="btnSettings" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a1.95 1.95 0 1 1-3.9 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a1.95 1.95 0 1 1 0-3.9h.1a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06A1.95 1.95 0 1 1 6.95 4.7l.06.06a1.6 1.6 0 0 0 1.77.32H8.9a1.6 1.6 0 0 0 .97-1.47V3a1.95 1.95 0 1 1 3.9 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97H21a1.95 1.95 0 1 1 0 3.9h-.1a1.6 1.6 0 0 0-1.5.97Z"/>
    </svg>
  </button>
</header>

<!-- ==========================================================================
     主内容：月历
     ======================================================================= -->
<main class="stage">
  <section class="cal" id="calCard" aria-label="月历">
    <div class="cal-head">
      <div>
        <h1 id="calTitle">2026 年 10 月</h1>
        <p id="calSub">周期打卡 · 一个任务只是一件事</p>
      </div>
      <div class="cal-nav">
        <button type="button" class="nav-btn" id="prevMonth" aria-label="上个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="pill-btn" id="todayBtn">回到今天</button>
        <button type="button" class="nav-btn" id="nextMonth" aria-label="下个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div class="week-head" id="weekHead"></div>
    <div class="grid" id="grid"></div>

    <div class="legend">
      <b><i class="l-done"></i>已打卡</b>
      <b><i class="l-todo"></i>待打卡</b>
      <b><i class="l-note"></i>记事</b>
      <b><i class="l-today"></i>今天</b>
      <span class="tip">点日期打开当天打卡 · 打卡一次，整个周期内所有命中日同步</span>
    </div>
  </section>
</main>

</div><!-- /#appShell -->

<button type="button" class="snap-handle" id="snapHandle" hidden aria-label="展开窗口" title="展开">
  <svg viewBox="0 0 16 24" fill="currentColor" aria-hidden="true"><path d="M12 4 4 12l8 8V4Z"/></svg>
</button>

<!-- ==========================================================================
     规则管理（整页覆盖层）
     ======================================================================= -->
<!-- 管理覆盖层：工具条「＋」打开；左导航 规则 / 记事 / 倒数日 / 笔记本 + 右内容 -->
<section class="screen" id="rulesScreen" hidden aria-label="管理">

<script>
/* ============================================================================
   10. 通用工具 · 日期（一律 'YYYY-MM-DD' 字符串 + 公历分量运算，不用时间戳算日期）
   ========================================================================= */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const pad2 = n => String(n).padStart(2, '0');

function toKey(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
function parseKey(key) {
  return { y: +key.slice(0, 4), m: +key.slice(5, 7), d: +key.slice(8, 10) };
}
function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function daysInMonth(y, m) { return m === 2 && isLeapYear(y) ? 29 : MONTH_DAYS[m - 1]; }

/* 连续日序数（1970-01-01 记 0）：纯公历分量推算，不经过 Date 时间戳 */
function daySerial(key) {
  const { y, m, d } = parseKey(key);
  const a  = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  const jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy
            + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  return jdn - 2440588;
}
function keyFromSerial(n) {
  const jdn = n + 2440588;
  const a = jdn + 32044;
  const b = Math.floor((4 * a + 3) / 146097);
  const c = a - Math.floor(146097 * b / 4);
  const d = Math.floor((4 * c + 3) / 1461);
  const e = c - Math.floor(1461 * d / 4);
  const mp = Math.floor((5 * e + 2) / 153);
  const day = e - Math.floor((153 * mp + 2) / 5) + 1;
  const month = mp + 3 - 12 * Math.floor(mp / 10);
  const year = 100 * b + d - 4800 + Math.floor(mp / 10);
  return toKey(year, month, day);
}
const addDaysKey = (key, n) => keyFromSerial(daySerial(key) + n);
const diffDays   = (aKey, bKey) => daySerial(bKey) - daySerial(aKey);

/* weekdayIndex：周一 = 0 … 周日 = 6（两端必须一致） */
function weekdayIndex(key) {
  const s = daySerial(key);
  return (((s + 3) % 7) + 7) % 7;
}

const WEEK_CN  = ['一', '二', '三', '四', '五', '六', '日'];
const WEEK_CN2 = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const mdText   = key => { const p = parseKey(key); return `${p.m}/${pad2(p.d)}`; };
const cnDate   = key => { const p = parseKey(key); return `${p.m} 月 ${p.d} 日`; };
const rangeText = (a, b) => (b && b !== a ? `${mdText(a)}~${mdText(b)}` : mdText(a));

/* ---------- 每月 / 每年的「该月实际目标日」 ----------
   monthly：min(monthDay, 该月天数)；monthDay === 'last' 取该月最后一天
   yearly ：yearDay 与该月天数做同样的月末钳制（2/29 平年落 2/28）
   一律走 parseKey / daysInMonth / toKey，不用时间戳算日期 */
function monthTargetDay(monthDay, y, m) {
  const dim = daysInMonth(y, m);
  if (monthDay === 'last') return dim;
  return Math.min(Number(monthDay) || 1, dim);
}
function monthTargetKey(monthDay, y, m) { return toKey(y, m, monthTargetDay(monthDay, y, m)); }

const parseMonthDay  = v => (v === 'last' ? 'last' : Math.max(1, Math.min(31, Number(v) || 1)));
const parseYearMonth = v => Math.max(1, Math.min(12, Number(v) || 1));
const parseYearDay   = v => Math.max(1, Math.min(31, Number(v) || 1));

   存储用 notify / alarm 两个布尔；旧数据的单值 mode 由 channelsOf 兜底迁移。 */
const CHANNELS_OF_MODE = {
  none:   { notify: false, alarm: false },
  notify: { notify: true,  alarm: false },
  alarm:  { notify: false, alarm: true  },
  both:   { notify: true,  alarm: true  },
};

  const ch = CHANNELS_OF_MODE[mode] || { notify: false, alarm: false };
  return { notify: ch.notify, alarm: ch.alarm, time, notifyText: notifyText || '', snooze: Boolean(snooze) };
};

/** 统一取提醒通道：新数据读布尔，旧数据（只有 mode）就地迁移 */

  if (!r) return { notify: false, alarm: false };
  if (typeof r.notify === 'boolean' || typeof r.alarm === 'boolean') {

  return CHANNELS_OF_MODE[r.mode] || { notify: false, alarm: false };

   紧凑档按定稿 §5.5：1 条任务名 + N + 一排圆点。 */
const DENSITY = {
  compact:  { name: '紧凑', tags: 1,  dots: true  },
  standard: { name: '标准', tags: 2,  dots: false },
  loose:    { name: '宽松', tags: 4,  dots: false },

/**
 * 断点语义（定稿 §5.5，PC 与 Android 卡片一致）：
 *   < 720px        → 紧凑（1 条任务名 + N + 圆点）
 *   720 ~ 1080px   → 标准（2 条 + N）
 *   > 1080px       → 宽松（最多 4 条 + N）
 * 贴桌面壁纸时窗口尺寸是用户拖出来的，所以必须跟着宽度自动切。
 */
const DENSITY_BREAKPOINTS = [
  { min: 1081, density: 'loose' },
  { min: 720,  density: 'standard' },
  { min: 0,    density: 'compact' },
];

/** 按当前视口宽度算出该用哪一档 */
function densityForWidth(width) {
  const hit = DENSITY_BREAKPOINTS.find(b => width >= b.min);
  return hit ? hit.density : 'compact';
}

/* ============================================================================
   13. 规则引擎：命中日 occursOn / 周期 periodStartOf / 打卡状态
   ========================================================================= */
/* occursOn / periodStartOf / periodEndOf 一律传「规则」（记事与倒数日也走同一套字段） */
function occursOn(item, dateKey) {
  if (item.kind === 'countdown') return false;                 // 倒数日不进日历格子
  if (item.kind === 'notebook') return false;                  // 笔记本没有日期，永不排期
  if (item.enabled === false) return false;
  /* 记事：start 留空 = 不排期；end 留空 = 只在当天；两者都有 = 时间段内每一天 */
  if (item.kind === 'note') {
    if (!item.start) return false;
    const end = item.end && item.end >= item.start ? item.end : item.start;
    return dateKey >= item.start && dateKey <= end;
  }
  const d = dateKey;
  const repeat = item.repeat || 'none';
  if (d < item.start) return false;
  if (repeat === 'none') return d >= item.start && d <= (item.end || item.start);
  if (item.repeatUntil && d > item.repeatUntil) return false;
  if (item.end && d > item.end) return false;
  if (repeat === 'weekly') return (item.weekdays || []).includes(weekdayIndex(d));
  if (repeat === 'every') {
    const diff = diffDays(item.start, d);
    return diff >= 0 && diff % clampEvery(item.every) === 0;
  }
  if (repeat === 'monthly') {
    const mk = parseKey(d);
    return mk.d === monthTargetDay(parseMonthDay(item.monthDay), mk.y, mk.m);
  }
  if (repeat === 'yearly') {
    const mk = parseKey(d);
    const ym = parseYearMonth(item.yearMonth);
    if (mk.m !== ym) return false;
    return mk.d === monthTargetDay(parseYearDay(item.yearDay), mk.y, ym);
  }
  return false;
}

function periodStartOf(item, dateKey) {
  const repeat = item.repeat || 'none';
  if (repeat === 'weekly') return addDaysKey(dateKey, -weekdayIndex(dateKey));
  if (repeat === 'every') {
    const n = clampEvery(item.every);
    return addDaysKey(item.start, Math.floor(diffDays(item.start, dateKey) / n) * n);
  }
  if (repeat === 'monthly') {
    const p = parseKey(dateKey);
    return monthTargetKey(parseMonthDay(item.monthDay), p.y, p.m);
  }
  if (repeat === 'yearly') {
    const p = parseKey(dateKey);
    const ym = parseYearMonth(item.yearMonth);
    return toKey(p.y, ym, monthTargetDay(parseYearDay(item.yearDay), p.y, ym));
  }
  return item.start;
}

function periodEndOf(item, dateKey) {
  const ps = periodStartOf(item, dateKey);
  const repeat = item.repeat || 'none';
  if (repeat === 'weekly') return addDaysKey(ps, 6);
  if (repeat === 'every') return addDaysKey(ps, clampEvery(item.every) - 1);
  return ps;
}

/* ---------------------------------------------------------------------------
   两级模型：命中日由「规则」决定，打卡按「任务」独立
   - 规则 = 基础条件容器（重复 + 提醒 + tasks[]）
   - 扁平任务 = 规则在当天展开出的一项：{ kind:'task', id: taskId, title, rule, task }
   - 打卡 key = taskId + ':' + periodStartOf(rule, date)
   ------------------------------------------------------------------------- */
/* 规则没有 kind 字段（记事 / 倒数日各自保留 kind），任务只存在于规则的 tasks[] 里 */
const isRule   = it => !!it && it.kind !== 'note' && it.kind !== 'countdown' && it.kind !== 'notebook';
const allRules = () => STATE.items.filter(isRule);
const allTasks = () => allRules().reduce((acc, r) => acc.concat(r.tasks.map(t => ({ rule: r, task: t }))), []);
const findItem = id => STATE.items.find(it => it.id === id);
const findRule = id => STATE.items.find(it => isRule(it) && it.id === id);
function locateTask(taskId) {
  const rule = STATE.items.filter(isRule).find(r => (r.tasks || []).some(t => t.id === taskId));
  return rule ? { rule, task: rule.tasks.find(t => t.id === taskId) } : null;
}

const checkKey = (taskId, rule, dateKey) => `${taskId}:${periodStartOf(rule, dateKey)}`;
const isDone   = (task, dateKey) => STATE.checkins.get(checkKey(task.id, task.rule, dateKey)) === true;
function setDone(task, dateKey, value) {
  const k = checkKey(task.id, task.rule, dateKey);
  if (value) STATE.checkins.set(k, true); else STATE.checkins.delete(k);
}

/** 规则在当天展开出的任务（规则停用 / 任务停用都不出现） */
function flatTasksOn(rule, dateKey) {
  if (!occursOn(rule, dateKey)) return [];
  return (rule.tasks || []).filter(t => t.enabled !== false).map(t => ({
    kind: 'task', id: t.id, title: t.title, ruleId: rule.id, rule, task: t,
  }));
}

/** 当天全部条目：按规则展开的任务 + 记事（倒数日不进日历） */
function itemsOn(dateKey) {
  const out = [];
  STATE.items.forEach(it => {
    if (isRule(it)) out.push(...flatTasksOn(it, dateKey));
    else if (occursOn(it, dateKey)) out.push(it);
  });
  return out;
}
const tasksOn = dateKey => itemsOn(dateKey).filter(it => it.kind === 'task');
const notesOn = dateKey => itemsOn(dateKey).filter(it => it.kind === 'note');

/* 初始打卡：本周「健身」已打卡 + 10/13~10/18「早起」已打卡（key 用 taskId；同属一周） */
function resetCheckins() {
  STATE.checkins.clear();
  const work = findRule('r_work');
  if (!work) return;
  STATE.checkins.set(checkKey('fit', work, TODAY), true);
  for (let k = '2026-10-13'; k <= '2026-10-18'; k = addDaysKey(k, 1)) {
    STATE.checkins.set(checkKey('early', work, k), true);
  }
}

/* ============================================================================
   15. 月历渲染
   ========================================================================= */
const gridEl  = $('#grid');
const titleEl = $('#calTitle');
const subEl   = $('#calSub');
const weekHeadEl = $('#weekHead');

function renderWeekHead() {
  const order = STATE.weekStart === 1 ? [0, 1, 2, 3, 4, 5, 6] : [6, 0, 1, 2, 3, 4, 5];
  weekHeadEl.innerHTML = order.map(i => `<div>周${WEEK_CN[i]}</div>`).join('');
}

/** 月视图的 42 个格子（周一起始时首格回退到该周周一） */
function buildDates(y, m) {
  const firstKey = toKey(y, m, 1);
  const offset = STATE.weekStart === 1 ? weekdayIndex(firstKey) : (weekdayIndex(firstKey) + 1) % 7;
  const startKey = addDaysKey(firstKey, -offset);
  return Array.from({ length: 42 }, (_, i) => addDaysKey(startKey, i));
}

/**
 * 仅显示层排序：记事最先（格子放不下时要优先保住它），其后未完成，最后已完成。
 * 记事是一段时间的信息，被任务挤掉就看不见了；任务还有 +N 可查。
 */
function sortForCell(dateKey, items) {
  const rank = (it) => (it.kind === 'note' ? 0 : (isDone(it, dateKey) ? 2 : 1));
  return [...items].sort((a, b) => rank(a) - rank(b));
}

/** 紧凑档：一排圆点表示当天任务总数，实心 = 已完成 */
function dotsHtml(dateKey, items) {
  const dots = items.map(it => {
    const cls = it.kind === 'note' ? 'note' : (isDone(it, dateKey) ? 'done' : '');
    return `<i class="${cls}"></i>`;
  }).join('');
  return `<div class="dots">${dots}</div>`;
}

/**
 * 标签行内 HTML（不含外层 .tags 容器）。
 * +N 的 N 一律用「总数 − 实际显示条数」，所以像素适配把条数降下来后 +N 会自动变大。
 */
function tagRowsHtml(dateKey, maxTags) {
  const all = itemsOn(dateKey);
  const shown = sortForCell(dateKey, all).slice(0, Math.max(0, maxTags));
  const rest = all.length - shown.length;
  const html = shown.map(it => {
    if (it.kind === 'note') {
      return `<div class="tag note"><span class="nm">${esc(it.title)}</span></div>`;
    }
    const done = isDone(it, dateKey);
    return `<div class="tag ${done ? 'done' : ''}">${done ? ICON.check : ''}<span class="nm">${esc(it.title)}</span></div>`;
  }).join('');
  return html + (rest > 0 ? `<div class="tag more">+${rest}</div>` : '');
}

/** 格子里任务区的外层 HTML：任务名若干条（+N）＋密度要求时的圆点排 */
function dayTags(dateKey, maxTags, withDots) {
  const items = itemsOn(dateKey);
  if (!items.length) return '';
  const rows = tagRowsHtml(dateKey, maxTags);
  const dots = withDots ? dotsHtml(dateKey, items) : '';
  return `<div class="tags">${rows}</div>${dots}`;
}

/**
 * 密度档位只是上限；格子变矮时（窗口小 / 宽松字号）还要按实际像素收缩，
 * 否则 +N 或圆点会被裁掉。降级顺序：减少任务名条数 → 去掉圆点排 → 至少留 +N。
 * 每次都用 renderGrid 之外的整体重排（cell 里的 .tags / .dots 两个节点一起换），
 * 这样 +N 始终等于「总数 − 实际显示条数」。
 */
function fitTagsInGrid() {
  const cfg = DENSITY[STATE.density];
  $$('#grid .cell').forEach(cell => {
    const key = cell.dataset.date;
    const total = itemsOn(key).length;
    if (!total) return;
    // .tags 是 overflow:hidden，子元素溢出不会反映到 cell.scrollHeight，
    // 所以必须同时比对 .tags 自身的 scrollHeight，否则第 4 条会被静默裁掉半行。
    const fits = () => {
      if (cell.scrollHeight > cell.clientHeight + 1) return false;
      const tags = cell.querySelector('.tags');
      if (tags && tags.scrollHeight > tags.clientHeight + 1) return false;
      const dots = cell.querySelector('.dots');
      if (dots && dots.scrollHeight > dots.clientHeight + 1) return false;
      return true;
    };
    if (fits()) return;

    // 1) 逐级减少任务名条数（1 → 0 条，0 条时只剩 +N）
    for (let max = Math.min(cfg.tags, total) - 1; max >= 1; max -= 1) {
      setCellBody(cell, dayTags(key, max, cfg.dots));
      if (fits()) return;
    }
    // 2) 还放不下：去掉圆点排，只留 +N
    setCellBody(cell, dayTags(key, 0, false));
    if (fits()) return;
    // 3) 极端情况：整块任务区隐藏（宁可空，也不裁切）
    setCellBody(cell, '');
  });
}

/** 只替换格子里的任务区（.tags / .dots），保留日期数字 */
function setCellBody(cell, html) {
  const dnum = cell.querySelector('.dnum');
  cell.innerHTML = '';
  if (dnum) cell.appendChild(dnum);
  cell.insertAdjacentHTML('beforeend', html);
}

function renderGrid() {
  const { y, m } = STATE.view;
  const cfg = DENSITY[STATE.density];
  document.documentElement.dataset.density = STATE.density;
  titleEl.textContent = `${y} 年 ${m} 月`;
  const tCount = tasksOn(TODAY).filter(it => isDone(it, TODAY)).length;
  const liveRules = allRules().filter(r => r.enabled !== false);
  const liveTasks = liveRules.reduce((n, r) => n + (r.tasks || []).filter(t => t.enabled !== false).length, 0);
  subEl.textContent = `本月 ${liveRules.length} 条规则 · ${liveTasks} 个任务 · 今天已完成 ${tCount} / ${tasksOn(TODAY).length}`;

  const dates = buildDates(y, m);
  gridEl.innerHTML = dates.map(key => {
    const p = parseKey(key);
    const mute = p.m !== m;
    const isToday = key === TODAY;
    return `<div class="cell${mute ? ' mute' : ''}" data-date="${key}" role="button" tabindex="0"
                 aria-label="${p.m} 月 ${p.d} 日${isToday ? '（今天）' : ''}，${itemsOn(key).length} 项">
      <div class="dnum${isToday ? ' today' : ''}">${p.d}</div>
      ${dayTags(key, cfg.tags, cfg.dots)}
    </div>`;
  }).join('');
}

function renderCalendar() {
  renderWeekHead();
  renderGrid();
  fitTagsInGrid();
}

/* ============================================================================
   15.1 密度跟随窗口（ResizeObserver 驱动 STATE.density）
   ========================================================================= */
/**
 * 让 STATE.density 跟着宽度走。手动覆盖（densityAuto = false）时完全不碰。
 * 观察日历卡片本身而不是只看 window：贴壁纸层 / 被父容器挤压时，卡片宽度才是真实可用宽度。
 */
function applyAutoDensity(force) {
  if (!STATE.densityAuto) return;
  const next = densityForWidth(measureDensityWidth());
  if (!force && next === STATE.density) return;
  STATE.density = next;
  PREF.density = next;
  document.documentElement.dataset.density = next;
  renderGrid();
  fitTagsInGrid();
  refreshAppearancePanel();
}

/** 取可用宽度：优先日历卡片，卡片还没上屏时退回视口宽度 */
function measureDensityWidth() {
  const card = document.getElementById('calCard');
  const w = card && card.getBoundingClientRect().width;
  return w && w > 0 ? w : (window.innerWidth || 0);
}

   ========================================================================= */
const fxCanvas = $('#fx');
const fxCtx = fxCanvas.getContext('2d');
const FX = { parts: [], raf: 0, deadline: 0, last: 0 };

function fxResize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fxCanvas.width  = Math.floor(innerWidth * dpr);
  fxCanvas.height = Math.floor(innerHeight * dpr);
  fxCanvas.style.width  = innerWidth + 'px';
  fxCanvas.style.height = innerHeight + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener('resize', fxResize);

/**
 * 烟花：从 (x, y) 炸开，橙色系 + 少量白色，受重力衰减。
 * 粒子推进按真实帧间隔缩放，并用 FX.deadline 硬截止（900ms），
 * 保证低帧率设备上也能在 600~900ms 内消失并清理画布。
 */
const FX_LIFE = 900;

const fireworks = {
  burst(x, y) {
    const palette = ['#f97316', '#fb923c', '#fdba74', '#ffffff', '#f97316', '#fff4ec'];
    const count = 46;
    for (let i = 0; i < count; i += 1) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.22;
      const speed = 2.1 + Math.random() * 3.4;
      FX.parts.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 0.7,
        life: 1,
        decay: 0.018 + Math.random() * 0.016,
        size: 1.6 + Math.random() * 2.1,
        color: palette[Math.floor(Math.random() * palette.length)],
      });
    }
    FX.deadline = Math.max(FX.deadline, performance.now() + FX_LIFE);
    if (!FX.raf) { FX.last = 0; FX.raf = requestAnimationFrame(fxTick); }
  },
};

function fxClear() {
  FX.parts.length = 0;
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  FX.raf = 0;
  FX.last = 0;
  FX.deadline = 0;
}

function fxTick(now) {
  const scale = FX.last ? Math.min(3, Math.max(0.35, (now - FX.last) / 16.667)) : 1;
  FX.last = now;
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);

  if (now >= FX.deadline) { fxClear(); return; }

  const g = 0.075 * scale;
  for (let i = FX.parts.length - 1; i >= 0; i -= 1) {
    const p = FX.parts[i];
    const drag = Math.pow(0.975, scale);
    p.vx *= drag;
    p.vy = p.vy * drag + g;
    p.x += p.vx * scale;
    p.y += p.vy * scale;
    p.life -= p.decay * scale;
    if (p.life <= 0) { FX.parts.splice(i, 1); continue; }
    fxCtx.globalAlpha = Math.max(0, p.life) * 0.95;
    fxCtx.fillStyle = p.color;
    fxCtx.beginPath();
    fxCtx.arc(p.x, p.y, p.size * (0.45 + p.life * 0.55), 0, Math.PI * 2);
    fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;

  if (FX.parts.length) FX.raf = requestAnimationFrame(fxTick);
  else fxClear();
}

const sheetMask = $('#sheetMask');
/* 周期文案：入参一律是「规则」（重复与提醒都挂在规则上） */
function periodLabel(rule, dateKey) {
  const ps = periodStartOf(rule, dateKey);
  const pe = periodEndOf(rule, dateKey);
  const repeat = rule.repeat || 'none';
  if (repeat === 'weekly') return `本周周期 ${mdText(ps)} ~ ${mdText(pe)}`;
  if (repeat === 'every') return `本周期 ${mdText(ps)} ~ ${mdText(pe)}`;
  if (repeat === 'monthly') return `本月周期 ${mdText(ps)}`;
  if (repeat === 'yearly') return `本年周期 ${mdText(ps)}`;
  return `本周期 ${mdText(ps)}`;
}

function openSheet(dateKey) {
  STATE.sheetDate = dateKey;
