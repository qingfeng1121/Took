/* ============================================================================
   20.2 统计分析（数据全部由 STATE 现算，不写死任何样例值）
   ----------------------------------------------------------------------------
   口径：按「周期」统计，不按天。一个周期 = periodStartOf(规则, 命中日)
        规则级完成率 = Σ(其下每个任务已打卡周期) ÷ Σ(其下每个任务应完成周期)
   ========================================================================= */
const analysisScreen = $('#analysisScreen');

const AN_RANGES = [
  { id: 'week',    label: '本周'    },
  { id: 'month',   label: '本月'    },
  { id: 'd30',     label: '近 30 天' },
  { id: 'quarter', label: '本季度'  },
  { id: 'year',    label: '今年'    },
];

const AN_TYPES = [
  { id: 'rate',   label: '完成率',   sub: '按周期统计：已完成周期 ÷ 应完成周期，同一周期内重复打卡只计一次' },
  { id: 'count',  label: '打卡次数', sub: '按周期统计：区间内实际完成的周期数，按天看打卡节奏' },
  { id: 'detail', label: '任务明细', sub: '按任务展开应完成与已完成周期，用来定位被漏掉的任务' },
  { id: 'streak', label: '连续天数', sub: '按周期统计：当天所有命中任务都打卡才算连续，断一天重新起算' },
];

const AN_SORT_DEFAULT = { rule: 'asc', task: 'asc', exp: 'desc', done: 'desc', rate: 'desc', last: 'desc' };
const AN_COL_NAME    = { rule: '规则', task: '任务', exp: '应完成周期', done: '已完成', rate: '完成率', last: '最近打卡' };
const AN_BAR_NOUN    = { rate: '完成情况', count: '打卡次数', detail: '任务覆盖', streak: '打卡分布' };
const AN_BAR_HINT = {
  rate:   '柱高 = 该段时间内应完成的周期数，橙色为已完成部分',
  count:  '柱高 = 该段时间内完成的周期数',
  detail: '柱高 = 该段时间内有打卡的任务种类数',
  streak: '柱高 = 该段时间内完成的周期数，连续成片即为连续段',
};

const anState = { range: 'month', type: 'rate', sort: { key: 'rate', dir: 'desc' } };
const anTypeMeta = id => AN_TYPES.find(t => t.id === id) || AN_TYPES[0];

/* ---------------------------------------------------------------- 区间计算 */
/** 五个时间范围的 [startKey, endKey]，一律走 addDaysKey / toKey，不碰时间戳 */
function anRangeKeys(id) {
  const p = parseKey(TODAY);
  if (id === 'week') {
    const s = addDaysKey(TODAY, -weekdayIndex(TODAY));
    return { start: s, end: addDaysKey(s, 6) };
  }
  if (id === 'month') {
    return { start: toKey(p.y, p.m, 1), end: toKey(p.y, p.m, daysInMonth(p.y, p.m)) };
  }
  if (id === 'd30') return { start: addDaysKey(TODAY, -29), end: TODAY };
  if (id === 'quarter') {
    const qm = Math.floor((p.m - 1) / 3) * 3 + 1;
    return { start: toKey(p.y, qm, 1), end: toKey(p.y, qm + 2, daysInMonth(p.y, qm + 2)) };
  }
  return { start: toKey(p.y, 1, 1), end: toKey(p.y, 12, 31) };
}

/** 区间内所有命中日：逐日 occursOn 判定（日期运算全走 addDaysKey） */
function anOccurDates(rule, start, end) {
  const out = [];
  for (let k = start; k <= end; k = addDaysKey(k, 1)) if (occursOn(rule, k)) out.push(k);
  return out;
}

/** 上一个同长度区间，用于 KPI 的「较上期」对比（同样只走日期工具） */
function anPrevRangeKeys(id) {
  const cur = anRangeKeys(id);
  const days = diffDays(cur.start, cur.end) + 1;
  if (id === 'month') {
    const p = parseKey(cur.start);
    const y = p.m === 1 ? p.y - 1 : p.y;
    const m = p.m === 1 ? 12 : p.m - 1;
    return { start: toKey(y, m, 1), end: toKey(y, m, daysInMonth(y, m)) };
  }
  if (id === 'quarter') {
    const p = parseKey(cur.start);
    const qm = p.m - 3 < 1 ? p.m + 9 : p.m - 3;
    const y = p.m - 3 < 1 ? p.y - 1 : p.y;
    return { start: toKey(y, qm, 1), end: toKey(y, qm + 2, daysInMonth(y, qm + 2)) };
  }
  if (id === 'year') return { start: toKey(parseKey(cur.start).y - 1, 1, 1), end: toKey(parseKey(cur.start).y - 1, 12, 31) };
  const end = addDaysKey(cur.start, -1);
  return { start: addDaysKey(end, -(days - 1)), end };
}

/** 图表分桶：按天时自动合并（≤7 天逐日，≤31 天每天，≤100 天按 3 天，更长按 7 天） */
function anGranularity(days) {
  if (days <= 31) return { size: 1, name: '每日' };
  if (days <= 100) return { size: 3, name: '每 3 天' };
  return { size: 7, name: '每周' };
}

/* ---------------------------------------------------------------- 主计算 */
function anCompute(rangeId, usePrev) {
  const { start, end } = usePrev ? anPrevRangeKeys(rangeId) : anRangeKeys(rangeId);
  const totalDays = diffDays(start, end) + 1;
  const gran = anGranularity(totalDays);

  /** 本次计算的索引：checkins 按 taskId 归组；命中日按规则归组 */
  const idx = { byTask: new Map(), rules: [] };
  const bucketHit = (key) => {
    const i = diffDays(start, key);
    return i >= 0 && i < totalDays ? Math.floor(i / gran.size) : -1;
  };

  let allDone = 0;
  let allExp = 0;
  const rows = [];
  const activity = new Map();     // 区间内完成过的 taskId → 次数
  const datesWithDone = new Set();
  const ruleStreak = new Map();

  allRules().forEach(rule => {
    const dates = anOccurDates(rule, start, end);
    if (!dates.length) return;
    const psSet = new Set(dates.map(d => periodStartOf(rule, d)));
    if (!psSet.size) return;
    idx.rules.push({ rule, psSet, size: psSet.size });

    (rule.tasks || []).filter(t => t.enabled !== false).forEach(task => {
      let done = 0;
      let last = '';
      psSet.forEach(ps => {
        const ck = task.id + ':' + ps;
        if (STATE.checkins.get(ck) !== true) return;
        done += 1;
        if (!last || ps > last) last = ps;
        activity.set(task.id, (activity.get(task.id) || 0) + 1);
        datesWithDone.add(ps);
        const b = bucketHit(ps);
        if (b >= 0) {
          const arr = idx.byTask.get(task.id);
          if (!arr) idx.byTask.set(task.id, [b]); else arr.push(b);
        }
      });
      allDone += done;
      allExp += psSet.size;
      rows.push({ rule: rule.title, ruleId: rule.id, task: task.title, taskId: task.id, exp: psSet.size, done, last });
    });
  });

  // 连续天数：从今天往前逐日回看，当天全部命中任务都已完成才算 +1
  let curStreak = 0;
  for (let k = TODAY; curStreak < 3660; k = addDaysKey(k, -1)) {
    const hit = tasksOn(k);
    if (!hit.length) break;
    if (!hit.every(it => isDone(it, k))) break;
    curStreak += 1;
  }

  // 最长连续（限定在本区间内）：区间内完成的周期日连续成片即为一段
  const sortedDone = [...datesWithDone].sort();
  let bestStreak = 0;
  let run = 0;
  let prev = null;
  sortedDone.forEach(k => {
    run = (prev && addDaysKey(prev, 1) === k) ? run + 1 : 1;
    prev = k;
    if (run > bestStreak) bestStreak = run;
  });

  // 分桶：应完成 / 已完成 / 涉及任务种类
  const bucketN = Math.ceil(totalDays / gran.size);
  const buckets = Array.from({ length: bucketN }, () => ({ exp: 0, done: 0, tasks: 0 }));
  idx.rules.forEach(r => r.psSet.forEach(ps => { const b = bucketHit(ps); if (b >= 0) buckets[b].exp += 1; }));
  const taskSets = Array.from({ length: bucketN }, () => new Set());
  idx.byTask.forEach((arr, taskId) => {
    arr.forEach(b => { buckets[b].done += 1; taskSets[b].add(taskId); });
  });
  buckets.forEach((b, i) => { b.tasks = taskSets[i].size; });

  // 日均 / 最多的一天：按天统计，与周期口径并行展示
  const perDay = new Map();
  idx.rules.forEach(({ rule }) => {
    anOccurDates(rule, start, end).forEach(d => {
      const ps = periodStartOf(rule, d);
      let n = 0;
      (rule.tasks || []).filter(t => t.enabled !== false).forEach(t => {
        if (STATE.checkins.get(t.id + ':' + ps) === true) n += 1;
      });
      if (n) perDay.set(d, (perDay.get(d) || 0) + n);
    });
  });
  let maxDay = 0;
  let maxDayKey = '';
  perDay.forEach((v, k) => { if (v > maxDay || (v === maxDay && k > maxDayKey)) { maxDay = v; maxDayKey = k; } });

  // 连续天数：今天全天命中且全部完成时，当前连续可能延伸到「今天之后仍是同一周期」——
  // 这里保持口径简单可验证：就从 TODAY 逐日回看命中日。
  const lastDate = sortedDone.length ? sortedDone[sortedDone.length - 1] : '';

  return {
    start, end, totalDays, gran, buckets,
    rows, allDone, allExp,
    activity, perDay, maxDay, maxDayKey, lastDate,
    curStreak, bestStreak,
    activeDays: perDay.size,
    rulesHit: new Set(rows.filter(r => r.done > 0).map(r => r.ruleId)).size,
  };
}

/* ---------------------------------------------------------------- 数字 / 文案 */
const anPct = v => (v * 100).toFixed(1);
const anCN  = key => { const p = parseKey(key); return p.m + '月' + p.d + '日'; };

/** 环比文案：invert = 数值变小是好事 */
function anDelta(cur, prev, unit, invert, digits) {
  const d = +(cur - prev).toFixed(digits || 0);
  const eps = Math.pow(10, -(digits || 0)) / 2;
  if (Math.abs(d) < eps) return { text: '持平', cls: 'flat' };
  const good = invert ? d < 0 : d > 0;
  return { text: (d > 0 ? '+' : '') + d.toFixed(digits || 0) + unit, cls: good ? 'up' : 'down' };
}

function anRuleStats(rows) {
  const map = new Map();
  rows.forEach(r => {
    const o = map.get(r.ruleId) || { ruleId: r.ruleId, rule: r.rule, done: 0, exp: 0, tasks: 0, last: '' };
    o.done += r.done;
    o.exp += r.exp;
    o.tasks += 1;
    if (r.last > o.last) o.last = r.last;
    map.set(r.ruleId, o);
  });
  return [...map.values()].map(o => { o.rate = o.exp ? o.done / o.exp : 0; return o; });
}

/* ---------------------------------------------------------------- 空态 */
function anEmptyHtml(tip) {
  return '<div class="an-empty">'
    + '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
    + ' stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/>'
    + '<path d="M8 3.2v4M16 3.2v4M3.5 10.5h17"/><path d="M9 15h6"/></svg></span>'
    + '<b>这段时间没有打卡记录</b>'
    + '<span>' + esc(tip || '换一个时间范围，或完成一次打卡后再来看') + '</span>'
    + '</div>';
}

/* ---------------------------------------------------------------- KPI */
function anKpis(now, prev, type) {
  const rate = now.allExp ? now.allDone / now.allExp : 0;
  const pRate = prev.allExp ? prev.allDone / prev.allExp : 0;
  const perDay = now.totalDays ? now.allDone / now.totalDays : 0;
  const pPerDay = prev.totalDays ? prev.allDone / prev.totalDays : 0;
  const pending = now.rows.filter(r => r.done < r.exp).length;
  const pPending = prev.rows.filter(r => r.done < r.exp).length;
  const lastSub = now.lastDate ? '截至 ' + anCN(now.lastDate) : '区间内暂无打卡';

  if (type === 'count') {
    return [
      { label: '总打卡次数', value: now.allDone, unit: '次', sub: '上期 ' + prev.allDone + ' 次',
        delta: anDelta(now.allDone, prev.allDone, ' 次') },
      { label: '日均打卡', value: perDay.toFixed(2), unit: '次/天',
        sub: '共 ' + now.totalDays + ' 天，上期 ' + pPerDay.toFixed(2) + ' 次/天',
        delta: anDelta(+perDay.toFixed(2), +pPerDay.toFixed(2), ' 次/天', false, 2) },
      { label: '最多的一天', value: now.maxDay, unit: '次',
        sub: now.maxDayKey ? anCN(now.maxDayKey) + '，当天完成 ' + now.maxDay + ' 个周期' : '区间内暂无打卡',
        delta: anDelta(now.maxDay, prev.maxDay, ' 次') },
      { label: '涉及规则数', value: now.rulesHit, unit: '条',
        sub: '共 ' + anRuleStats(now.rows).length + ' 条规则在区间内有任务',
        delta: anDelta(now.rulesHit, prev.rulesHit, ' 条') },
    ];
  }
  if (type === 'detail') {
    return [
      { label: '参与任务', value: now.rows.length, unit: '个',
        sub: '分属 ' + anRuleStats(now.rows).length + ' 条规则', delta: anDelta(now.rows.length, prev.rows.length, ' 个') },
      { label: '应完成周期', value: now.allExp, unit: '个',
        sub: '覆盖 ' + now.totalDays + ' 天', delta: anDelta(now.allExp, prev.allExp, ' 个') },
      { label: '已完成周期', value: now.allDone, unit: '个',
        sub: '上期 ' + prev.allDone + ' 个', delta: anDelta(now.allDone, prev.allDone, ' 个') },
      { label: '待补漏任务', value: pending, unit: '个',
        sub: '上期 ' + pPending + ' 个', delta: anDelta(pending, pPending, ' 个', true) },
    ];
  }
  if (type === 'streak') {
    return [
      { label: '当前连续', value: now.curStreak, unit: '天', sub: lastSub,
        delta: anDelta(now.curStreak, prev.curStreak, ' 天') },
      { label: '最长连续', value: now.bestStreak, unit: '天', sub: '上期最长 ' + prev.bestStreak + ' 天',
        delta: anDelta(now.bestStreak, prev.bestStreak, ' 天') },
      { label: '活跃天数', value: now.activeDays, unit: '天',
        sub: '共 ' + now.totalDays + ' 天有打卡', delta: anDelta(now.activeDays, prev.activeDays, ' 天') },
      { label: '断档天数', value: Math.max(0, now.totalDays - now.activeDays), unit: '天', sub: '整天没有任何打卡',
        delta: anDelta(now.totalDays - now.activeDays, prev.totalDays - prev.activeDays, ' 天', true) },
    ];
  }
  return [
    { label: '完成率', value: anPct(rate), unit: '%', sub: '已完成 ' + now.allDone + ' / 应完成 ' + now.allExp + ' 个周期',
      delta: prev.allExp ? anDelta(+anPct(rate), +anPct(pRate), ' 个百分点', false, 1) : { text: '上期无数据', cls: 'flat' } },
    { label: '已完成周期', value: now.allDone, unit: '个', sub: '上期 ' + prev.allDone + ' 个',
      delta: anDelta(now.allDone, prev.allDone, ' 个') },
    { label: '当前连续', value: now.curStreak, unit: '天', sub: lastSub,
      delta: anDelta(now.curStreak, prev.curStreak, ' 天') },
    { label: '最长连续', value: now.bestStreak, unit: '天', sub: '上期最长 ' + prev.bestStreak + ' 天',
      delta: anDelta(now.bestStreak, prev.bestStreak, ' 天') },
  ];
}

function anRenderKpis(now, prev) {
  $('#anKpis').innerHTML = anKpis(now, prev, anState.type).map(k => {
    const d = k.delta;
    const arw = d.cls === 'up' ? '▲' : (d.cls === 'down' ? '▼' : '·');
    return '<div class="an-kpi">'
      + '<p class="an-kpi-label">' + esc(k.label) + '</p>'
      + '<p class="an-kpi-num"><b>' + k.value + '</b><span>' + esc(k.unit) + '</span></p>'
      + '<p class="an-kpi-sub">' + esc(k.sub) + '</p>'
      + '<p class="an-kpi-delta ' + d.cls + '"><span class="arw">' + arw + '</span>较上期 ' + esc(d.text) + '</p>'
      + '</div>';
  }).join('');
}

/* ---------------------------------------------------------------- 柱状图 */
function anMonthBand(now) {
  if (now.gran.size !== 1) return '';
  const groups = [];
  for (let i = 0; i < now.totalDays; i += 1) {
    const key = addDaysKey(now.start, i);
    const label = parseKey(key).m + '月';
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, n: 0 });
    groups[groups.length - 1].n += 1;
  }
  if (groups.length < 2) return '';
  return groups.map(g => '<span style="flex:' + g.n + ' 1 0">' + esc(g.label) + '</span>').join('');
}

function anRenderChart(now) {
  $('#anBarTitle').textContent = now.gran.name + AN_BAR_NOUN[anState.type];
  $('#anBarSub').textContent = AN_BAR_HINT[anState.type];
  $('#anBarLegend').innerHTML = anState.type === 'rate'
    ? '<span><i style="background:var(--accent)"></i>已完成</span><span><i style="background:var(--text-3)"></i>未完成</span>'
    : (anState.type === 'detail'
        ? '<span><i style="background:var(--accent-line)"></i>任务种类</span>'
        : '<span><i style="background:var(--accent)"></i>已完成周期</span>');

  const isEmpty = now.allDone === 0;
  $('#anPlotArea').hidden = isEmpty;
  $('#anPlotEmpty').hidden = !isEmpty;
  if (isEmpty) {
    $('#anPlotEmpty').innerHTML = anEmptyHtml();
    $('#anPlot').innerHTML = '';
    $('#anXlabels').innerHTML = '';
    $('#anXmonths').hidden = true;
    $('#anXmonths').innerHTML = '';
    return;
  }
  $('#anPlotEmpty').innerHTML = '';

  const maxExp = now.buckets.reduce((m, b) => Math.max(m, b.exp), 1);
  const maxVal = now.buckets.reduce((m, b) => Math.max(m, anState.type === 'detail' ? b.tasks : b.done), 1);

  $('#anPlot').innerHTML = now.buckets.map((b, i) => {
    let inner;
    if (anState.type === 'rate') {
      if (!b.exp) inner = '<div class="stub"></div>';
      else {
        const miss = Math.max(0, b.exp - b.done);
        const hDone = b.done / maxExp * 100;
        const hMiss = miss / maxExp * 100;
        inner = '<div class="stk">'
          + (hMiss > 0 ? '<div class="sgm miss" style="height:' + hMiss.toFixed(2) + '%"></div>' : '')
          + (hDone > 0 ? '<div class="sgm done" style="height:' + hDone.toFixed(2) + '%"></div>' : '')
          + '</div>';
      }
    } else if (anState.type === 'detail') {
      const hTask = b.tasks / maxVal * 100;
      inner = hTask > 0
        ? '<div class="stk"><div class="sgm task" style="height:' + hTask.toFixed(2) + '%"></div></div>'
        : '<div class="stub"></div>';
    } else {
      const hv = b.done / maxVal * 100;
      inner = hv > 0
        ? '<div class="stk"><div class="sgm done" style="height:' + hv.toFixed(2) + '%"></div></div>'
        : '<div class="stub"></div>';
    }
    return '<div class="an-bar" data-bi="' + i + '">' + inner + '</div>';
  }).join('');

  const n = now.buckets.length;
  const step = n <= 8 ? 1 : (n <= 16 ? 2 : Math.ceil(n / 11));
  $('#anXlabels').innerHTML = now.buckets.map((b, i) => {
    const show = (i % step === 0) || i === n - 1;
    if (!show) return '<span></span>';
    const from = addDaysKey(now.start, i * now.gran.size);
    return '<span>' + (now.gran.size === 1 ? parseKey(from).d : mdText(from)) + '</span>';
  }).join('');

  // 跨月（且按天分桶）时补一行月份色带
  const band = anMonthBand(now);
  $('#anXmonths').hidden = !band;
  $('#anXmonths').innerHTML = band;
}

/* ---------------------------------------------------------------- Top 5 */
function anRenderTop(now) {
  const titles = {
    rate:   ['各规则完成率 Top 5', '按规则汇总其下全部任务的周期'],
    count:  ['各任务打卡次数 Top 5', '统计区间内完成的周期数'],
    detail: ['各任务完成周期 Top 5', '已完成 ÷ 应完成'],
    streak: ['各任务最近打卡 Top 5', '按最近一次打卡日期排序'],
  }[anState.type];
  $('#anTopTitle').textContent = titles[0];
  $('#anTopSub').textContent = titles[1];

  if (now.allDone === 0) { $('#anTopBody').innerHTML = anEmptyHtml('区间内还没有任何已完成周期'); return; }

  let items;
  if (anState.type === 'rate') {
    items = anRuleStats(now.rows).sort((a, b) => b.rate - a.rate || b.done - a.done).slice(0, 5)
      .map(o => ({ name: o.rule, ratio: o.rate, label: anPct(o.rate) + '%' }));
  } else if (anState.type === 'count') {
    items = now.rows.slice().sort((a, b) => b.done - a.done || b.exp - a.exp).slice(0, 5)
      .map(r => ({ name: r.task, ratio: r.exp ? r.done / r.exp : 0, label: r.done + ' 次' }));
  } else if (anState.type === 'detail') {
    items = now.rows.slice().sort((a, b) => {
      const ra = a.exp ? a.done / a.exp : 0; const rb = b.exp ? b.done / b.exp : 0;
      return rb - ra || b.done - a.done;
    }).slice(0, 5).map(r => ({ name: r.task, ratio: r.exp ? r.done / r.exp : 0, label: r.done + ' / ' + r.exp }));
  } else {
    const maxRaw = now.rows.reduce((m, r) => Math.max(m, r.done), 1);
    items = now.rows.slice().sort((a, b) => (b.last > a.last ? 1 : (b.last < a.last ? -1 : b.done - a.done)))
      .slice(0, 5).map(r => ({ name: r.task, ratio: r.done / maxRaw, label: r.last ? anCN(r.last) : '—' }));
  }

  $('#anTopBody').innerHTML = '<div class="an-hb-list">' + items.map((it, i) => {
    const w = Math.max(it.ratio > 0 ? 3 : 0, it.ratio * 100);
    return '<div class="an-hb' + (i === 0 ? ' top' : '') + '">'
      + '<span class="an-hb-name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>'
      + '<span class="an-hb-track"><i style="width:' + w.toFixed(1) + '%"></i></span>'
      + '<span class="an-hb-val">' + esc(it.label) + '</span>'
      + '</div>';
  }).join('') + '</div>'
  + '<p class="an-card-foot">口径：一个周期只计一次，同一周内重复点击不会重复计数</p>';
}

/* ---------------------------------------------------------------- 表格 */
function anSortRows(rows) {
  const key = anState.sort.key;
  const dir = anState.sort.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    if (key === 'rule' || key === 'task') {
      const r = String(a[key]).localeCompare(String(b[key]), 'zh-Hans-CN');
      return (r || (b.done - a.done)) * dir;
    }
    let va; let vb;
    if (key === 'exp') { va = a.exp; vb = b.exp; }
    else if (key === 'done') { va = a.done; vb = b.done; }
    else if (key === 'rate') { va = a.exp ? a.done / a.exp : 0; vb = b.exp ? b.done / b.exp : 0; }
    else { va = a.last || ''; vb = b.last || ''; }
    if (va === vb) return (b.done - a.done) * dir;
    return (va < vb ? -1 : 1) * dir;
  });
}

function anRenderTable(now) {
  $$('.an-tbl thead th').forEach(th => {
    const k = th.dataset.akey;
    th.classList.remove('asc', 'desc', 'active');
    if (k === anState.sort.key) { th.classList.add(anState.sort.dir); th.classList.add('active'); }
    th.setAttribute('aria-sort', k === anState.sort.key
      ? (anState.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
  });

  $('#anTblSub').textContent = '点表头可切换排序 · 当前按「' + AN_COL_NAME[anState.sort.key] + '」'
    + (anState.sort.dir === 'asc' ? '升序' : '降序');

  if (anState.type === 'count') {
    $('#anTblCount').textContent = '共 ' + now.rows.length + ' 条任务 · 合计 ' + now.allDone + ' 次打卡';
  } else {
    $('#anTblCount').textContent = now.allDone === 0 ? '暂无数据'
      : '共 ' + now.rows.length + ' 条任务 · 已完成 ' + now.allDone + ' 个周期';
  }

  if (now.allDone === 0) {
    $('#anTblBody').innerHTML = '<tr><td colspan="6" class="an-nopad">' + anEmptyHtml() + '</td></tr>';
    return;
  }

  $('#anTblBody').innerHTML = anSortRows(now.rows).map(r => {
    const rate = r.exp ? r.done / r.exp : 0;
    const barCls = rate >= 0.8 ? '' : (rate >= 0.5 ? 'low' : 'zero');
    const barW = rate > 0 ? Math.max(3, rate * 100) : 0;
    const pill = anState.type === 'count' && r.done > 0
      ? '<span class="an-pill">' + r.done + ' 次</span>'
      : (r.done === 0 ? '<span class="an-pill plain">未打卡</span>' : '');
    return '<tr>'
      + '<td><span class="an-rule-cell"><i></i><span>' + esc(r.rule) + '</span></span></td>'
      + '<td><span class="an-task-cell"><em>' + esc(r.task) + '</em>' + (pill ? ' ' + pill : '') + '</span></td>'
      + '<td>' + r.exp + '</td>'
      + '<td>' + r.done + '</td>'
      + '<td><span class="an-rate"><span class="an-rate-track"><i class="' + barCls
      + '" style="width:' + barW.toFixed(1) + '%"></i></span><b>' + anPct(rate) + '%</b></span></td>'
      + '<td' + (r.last ? '' : ' class="an-mut"') + '>' + (r.last ? esc(anCN(r.last)) : '—') + '</td>'
      + '</tr>';
  }).join('');
}

/* ---------------------------------------------------------------- 总渲染 */
function anRenderAll() {
  const now = anCompute(anState.range, false);
  const prev = anCompute(anState.range, true);   // 上一个同长度区间，真实数据算出来的环比

  $('#anMRange').textContent = anCN(now.start) + ' – ' + anCN(now.end);
  $('#anMDays').textContent = '共 ' + now.totalDays + ' 天，' + now.gran.name + '分桶';
  $('#anMLast').textContent = now.lastDate ? '最近打卡 ' + anCN(now.lastDate) : '本区间暂无打卡';
  $('#anSub').textContent = anTypeMeta(anState.type).sub;
  $('#anTypeLabel').textContent = anTypeMeta(anState.type).label;

  anRenderKpis(now, prev);
  anRenderChart(now);
  anRenderTop(now);
  anRenderTable(now);
}

/* ---------------------------------------------------------------- 交互 */
function anBindRange() {
  $('#anRangeSeg').innerHTML = AN_RANGES.map(r =>
    '<button type="button" data-arange="' + r.id + '"' + (r.id === anState.range ? ' class="on"' : '') + '>'
    + r.label + '</button>').join('');
  $('#anRangeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button[data-arange]');
    if (!btn) return;
    anState.range = btn.dataset.arange;
    $$('#anRangeSeg button').forEach(b => b.classList.toggle('on', b === btn));
    anRenderAll();
  });
}

function anBindType() {
  const alpha = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"'
    + ' stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const panel = $('#anTypePanel');
  const dd = $('#anTypeDd');
  const btn = $('#anTypeBtn');

  panel.innerHTML = AN_TYPES.map(t =>
    '<button type="button" class="an-dd-item' + (t.id === anState.type ? ' on' : '') + '"'
    + ' role="option" aria-selected="' + (t.id === anState.type) + '" data-atype="' + t.id + '">'
    + '<span>' + t.label + '</span>' + alpha + '</button>').join('');

  const setOpen = open => {
    panel.hidden = !open;
    dd.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
  };

  btn.addEventListener('click', e => { e.stopPropagation(); setOpen(panel.hidden); });
  panel.addEventListener('click', e => {
    const item = e.target.closest('[data-atype]');
    if (!item) return;
    e.stopPropagation();
    anState.type = item.dataset.atype;
    $$('[data-atype]', panel).forEach(b => {
      const on = b === item;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
    });
    setOpen(false);
    anRenderAll();
  });
  document.addEventListener('click', () => { if (!panel.hidden) setOpen(false); });
  // Esc 先收起下拉，再关整页：用捕获阶段拦下，免得一次 Esc 把两层一起关掉
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !panel.hidden) { e.stopPropagation(); e.preventDefault(); setOpen(false); btn.focus(); }
  }, true);
}

function anBindSort() {
  $$('.an-tbl thead th').forEach(th => {
    th.setAttribute('tabindex', '0');
    const apply = () => {
      const k = th.dataset.akey;
      if (anState.sort.key === k) anState.sort.dir = anState.sort.dir === 'desc' ? 'asc' : 'desc';
      else anState.sort = { key: k, dir: AN_SORT_DEFAULT[k] };
      anRenderTable(anCompute(anState.range));
    };
    th.addEventListener('click', apply);
    th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apply(); } });
  });
}

/** 齿轮只负责设置；规则管理已经独立成覆盖层，由工具条按钮进入 */

  settingsScreen.hidden = true;

function renderNav(active) {
  setNav.innerHTML = SETTINGS_NAV.map(n => `<button type="button" data-tab="${n.id}"

  settingsScreen.dataset.tab = active;
  renderNav(active);

  {
    setMain.innerHTML = `<div class="set-panel on">${panelHtml(active)}</div>`;
    setMain.scrollTop = 0;
    bindSettingsPanel(active);

/* ---- 面板事件 ---- */
function bindSettingsPanel(tab) {
  $$('[data-pref]', setMain).forEach(sw => {
    const flip = () => {
      const on = sw.getAttribute('aria-checked') !== 'true';
      sw.setAttribute('aria-checked', String(on));
      PREF[sw.dataset.pref] = on;
      if (sw.dataset.pref === 'autoDiscover') PREF.autoDiscover = on;
    };
    sw.addEventListener('click', flip);
    sw.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
  });

  $$('[data-prefseg]', setMain).forEach(seg => {
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button[data-v]');
      if (!btn) return;
      applyPref(seg.dataset.prefseg, btn.dataset.v);
      renderSettings(tab);
    });
  });

  const opacityRange = $('#winOpacity');
  if (opacityRange) {
    opacityRange.style.setProperty('--p', opacityRange.value + '%');
    opacityRange.addEventListener('input', e => applyWindowOpacity(e.target.value));
  }

  const autoBtn = $('[data-density-auto]', setMain);
  if (autoBtn) autoBtn.onclick = () => {
    applyPref('density', 'follow');
    renderSettings(tab);
    showSnack('密度已恢复为跟随窗口');
  };

  const url = $('#syncUrl');
  if (url) url.addEventListener('input', e => { STATE.sync.url = e.target.value; STATE.sync.tested = false; });
  const token = $('#syncToken');
  if (token) token.addEventListener('input', e => {
    STATE.sync.token = e.target.value;
    STATE.sync.tested = false;
    PREF.syncState = e.target.value ? 'synced' : 'none';
  });
  const test = $('#syncTest');
  if (test) test.onclick = () => {
    test.disabled = true;
    test.textContent = '测试中…';
    setTimeout(() => {
      const latency = 18 + Math.floor(Math.random() * 26);
      STATE.sync.latency = latency;
      STATE.sync.tested = true;
      test.disabled = false;
      test.textContent = '测试连接';
      renderSettings('sync');
      showSnack(`连接成功 · 延迟 ${latency} ms`);
    }, 800);
  };
  const exp = $('#exportBtn');
  if (exp) exp.onclick = () => showSnack('已导出 took-backup-' + TODAY + '.json');
  const clr = $('#clearBtn');
  if (clr) clr.onclick = () => confirmDialog({
    title: '清空全部数据？',
    text: '本机的任务、规则、打卡记录会全部删除，无法撤销。',
    okText: '清空',
    onOk: () => {
      STATE.items = [];
      STATE.checkins.clear();
      renderGrid();
      fitTagsInGrid();
      renderRules();
      showSnack('已清空数据');
    },
  });

  const frame = $('#winFrame');
  if (frame) {
    const size = { '420x560': [150, 200], '900x420': [280, 132], auto: [220, 150] }[PREF.pinSize];
    frame.style.width = size[0] + 'px';
    frame.style.height = size[1] + 'px';
  }
}

function applyPref(key, value) {
  if (key === 'density') {
    if (value === 'follow') {
      STATE.densityAuto = true;
      PREF.densityAuto = true;
      applyAutoDensity(true);
      return;
    }
    STATE.densityAuto = false;
    PREF.densityAuto = false;
    STATE.density = value;
    PREF.density = value;
    document.documentElement.dataset.density = value;
    renderGrid();
    fitTagsInGrid();
    return;
  }
  if (key === 'theme') {
    document.documentElement.dataset.theme = value;
  }
  if (key === 'fontSize') {
    document.documentElement.dataset.size = value;
  }
  if (key === 'weekStart') {
    STATE.weekStart = +value;
    renderCalendar();
  }
  if (key === 'pinMode') {
    setPin(value);
    return;
  }
  if (key === 'snapEdge') {
    applySnap(value);
    return;
  }
  if (key === 'snapAutoHide') {
    PREF.snapAutoHide = value === 'on' || value === true;
    return;
  }
  PREF[key] = (key === 'weekStart' || key === 'snoozeMin') ? +value : value;
  if (key === 'theme') PREF.theme = value;
  if (key === 'fontSize') PREF.fontSize = value;
}

/** 导出：按当前区间与排序生成 CSV，走 Blob 下载，不依赖任何外部资源 */
function anExportCsv() {
  const now = anCompute(anState.range, false);
  const head = ['规则', '任务', '应完成周期', '已完成', '完成率', '最近打卡'];
  const lines = [head.join(',')].concat(anSortRows(now.rows).map(r => [
    r.rule, r.task, r.exp, r.done,
    (r.exp ? (r.done / r.exp * 100).toFixed(1) : '0.0') + '%',
    r.last ? anCN(r.last) : '',
  ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Took-统计-' + anCN(now.start) + '-' + anCN(now.end) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showSnack('已导出 ' + now.rows.length + ' 条任务明细');
}
$('#anExport').onclick = anExportCsv;

/* ============================================================================
   21.5 窗口外观：整体透明度 / 吸附边缘 / 收起成小三角
   ========================================================================= */
const appShell = () => $('#appShell');
const snapHandle = () => $('#snapHandle');
let shellCollapsed = false;

/** 透明度：40~100%，写在 #appShell 上；同时决定 body 是否透出桌面 */
function applyWindowOpacity(pct) {
  const v = Math.max(40, Math.min(100, Number(pct) || 100));
  PREF.windowOpacity = v;
  appShell().style.opacity = String(v / 100);
  // 只有真的半透明时才让 body 透出桌面底色，避免完全不透明时误透
  document.body.dataset.transparent = v < 100 ? 'on' : 'off';
  const val = $('#winOpacityVal');
  if (val) val.textContent = v + '%';
  const range = $('#winOpacity');
  if (range) range.style.setProperty('--p', v + '%');
}

/** 吸附：给外壳打 data-snap，并把圆角压平；小三角贴在对应边 */
function applySnap(edge) {
  const e = ['left', 'right', 'top', 'bottom'].includes(edge) ? edge : 'none';
  PREF.snapEdge = e;
  const shell = appShell();
  if (e === 'none') shell.removeAttribute('data-snap');
  else shell.dataset.snap = e;
  // 吸附后工具条里的提示同步
  const hint = $('#pinHint');
  if (hint && e !== 'none') hint.textContent = PIN_INFO[STATE.pin].hint + ' · 已吸附到' + ({ left: '左', right: '右', top: '上', bottom: '下' }[e]) + '边缘';
  snapHandle().dataset.edge = e === 'none' ? 'right' : e;
  if (e === 'none' && shellCollapsed) setShellCollapsed(false);
}

/** 收起 / 展开：收起时隐藏外壳，只留小三角；展开时复原并聚焦顶栏 */
function setShellCollapsed(collapsed) {
  shellCollapsed = !!collapsed;
  const shell = appShell();
  const handle = snapHandle();
  shell.hidden = shellCollapsed;
  handle.hidden = !shellCollapsed;
  if (shellCollapsed) {
    handle.focus({ preventScroll: true });
  } else {
    const btn = $('#btnCollapse');
    if (btn) btn.focus({ preventScroll: true });
  }
}

function bindWindowChrome() {
  const handle = snapHandle();
  handle.addEventListener('click', () => setShellCollapsed(false));
  $('#btnCollapse').addEventListener('click', () => {
    if (PREF.snapEdge === 'none') {
      showSnack('先把「吸附边缘」设成左/右/上/下，收起后才有贴边的小三角');
      return;
    }
    setShellCollapsed(true);
  });
  // Esc 在展开态下收起，收起态下展开不了（避免误关），只有点小三角或快捷键
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || shellCollapsed) return;
    if (!$('#dialogMask').hidden || !$('#confirmMask').hidden) return;
    if (!$('#sheetMask').hidden || !$('#bookPickerMask').hidden) return;
    if (!$('#rulesScreen').hidden || !$('#settingsScreen').hidden || !$('#analysisScreen').hidden || !$('#bookScreen').hidden) return;
    if (PREF.snapEdge === 'none') return;
    setShellCollapsed(true);
  });
  applyWindowOpacity(PREF.windowOpacity);
  applySnap(PREF.snapEdge);
}

/* ============================================================================
   22. 固定方式（工具条 ↔ 设置双向联动）
   ========================================================================= */
function setPin(mode, fromSettings) {
  if (!PIN_INFO[mode]) return;
  STATE.pin = mode;
  PREF.pinMode = mode;
  $$('#pinSeg button').forEach(b => {
    const on = b.dataset.pin === mode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  $('#pinHint').textContent = PIN_INFO[mode].hint;
  if (!fromSettings && !settingsScreen.hidden && settingsScreen.dataset.tab === 'pin') {
    renderSettings('pin');
  }
}

$('#pinSeg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-pin]');
  if (!btn) return;
  setPin(btn.dataset.pin);
  showSnack(`已切换为${PIN_INFO[btn.dataset.pin].label}`);
});

/* ============================================================================
   23. 初始化
   ========================================================================= */
function boot() {
  setPin('wallpaper');
  bindWindowChrome();
  // 首帧就按当前宽度定档，避免先渲染成默认档再抖一下
  STATE.density = densityForWidth(measureDensityWidth());
  PREF.density = STATE.density;
  document.documentElement.dataset.density = STATE.density;
  renderCalendar();
  fitTagsInGrid();
  renderRules();
  syncRulesChrome();
  $('#sheetDone').textContent = '完成';
}

boot();

</script>
