<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Took · 原型预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #eef0f4;
    --surface:     #ffffff;
    --line:        #f0f2f5;
    --text:        #1f2329;
    --text-2:      #8a9099;
    --text-3:      #ced3da;
    --accent:      #f97316;
    --accent-weak: #fff4ec;
    --accent-line: #fbbf94;
    --accent-text: #d9600f;
    --radius:      18px;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
  .brand small {
    display: block; font-size: 11px; font-weight: 400;
    color: var(--text-2); margin-top: 2px; letter-spacing: 0;
  }

  .seg {
    margin-left: auto;
    display: flex; gap: 4px; padding: 4px;
    background: #f4f6f8; border-radius: 11px;
  }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--text-2);
    padding: 7px 16px; border-radius: 8px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--surface); color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(16,24,40,.08);
  }

  .open {
    border: 1px solid #e6e9ee; background: var(--surface);
    color: var(--text-2); cursor: pointer;
    font-family: inherit; font-size: 12px;
    padding: 8px 13px; border-radius: 9px;
    transition: border-color .15s, color .15s;
  }
  .open:hover { border-color: var(--accent-line); color: var(--accent-text); }

  .stage { flex: 1; position: relative; overflow: hidden; }
  .stage iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0; background: var(--bg);
  }
  .stage iframe[hidden] { display: none; }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    Took · 原型预览
    <small>同一套周期打卡语义，两端各自实现</small>
  </div>

  <div class="seg" id="seg">
    <button data-view="pc" class="on">PC 端</button>
    <button data-view="android">Android 端</button>
  </div>

  <button class="open" id="openBtn">新窗口打开</button>
</div>

<div class="stage" id="stage">
  <iframe id="framePC" src="pc.html" title="PC 端原型"></iframe>
  <iframe id="frameAndroid" src="android.html" title="Android 端原型" hidden></iframe>
</div>

<script>
const VIEWS = {
  pc:      { frame: 'framePC',      href: 'pc.html' },
  android: { frame: 'frameAndroid', href: 'android.html' },
};

let current = 'pc';

const segBtns = [...document.querySelectorAll('#seg button')];

function show(view) {
  if (!VIEWS[view]) return;
  current = view;
  segBtns.forEach(b => b.classList.toggle('on', b.dataset.view === view));
  Object.entries(VIEWS).forEach(([key, cfg]) => {
    document.getElementById(cfg.frame).hidden = key !== view;
  });
}

segBtns.forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

document.getElementById('openBtn').onclick = () => {
  window.open(VIEWS[current].href, '_blank');
};
</script>
</body>
</html>
